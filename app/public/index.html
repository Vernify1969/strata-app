<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Strata App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F8FB;
  --surface: #FFFFFF;
  --ink: #0F172A;
  --muted: #475569;
  --line: #E2E8F0;
  --brand: #1D4ED8;
  --brand-ink: #FFFFFF;
  --accent: #1D4ED8;
  --accent-bg: #EFF6FF;
  --gold: #1D4ED8;
  --gold-ink: #1E3A8A;
  --field: #F8FAFC;
  --ok: #047857;
  --ok-bg: #ECFDF5;
  --warn: #92400E;
  --warn-bg: #FFFBEB;
  --bad: #9F1239;
  --bad-bg: #FFF1F2;
  --emergency: #BE123C;
  --emergency-ink: #FFFFFF;
  --sample-bg: #F1F5F9;
  --sample-ink: #334155;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
  --map: #EEF3F9;
  --river: #93B4D4;
  --grid: #D9E3EE;
}
:root[data-theme="dark"] {
  --bg: #071422;
  --surface: #0E1E36;
  --ink: #E8F0FA;
  --muted: #C5D4E8;
  --line: #1E3A5C;
  --brand: #93C5FD;
  --brand-ink: #071422;
  --accent: #93C5FD;
  --accent-bg: #132844;
  --gold: #E4C36A;
  --gold-ink: #3A2C0A;
  --field: #091628;
  --ok: #6EE7B7;
  --ok-bg: #064E3B;
  --warn: #FCD34D;
  --warn-bg: #422006;
  --bad: #FECDD3;
  --bad-bg: #4C0519;
  --emergency: #BE123C;
  --emergency-ink: #FFFFFF;
  --sample-bg: #172033;
  --sample-ink: #CBD5E1;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.35);
  --map: #0E1524;
  --river: #3D6490;
  --grid: #1E2A3E;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2 {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0;
}
h1 { font-size: 2.15rem; line-height: 1.15; }
h2 { font-size: 1.55rem; line-height: 1.25; }
h3, .brand, .top-title, .price {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
}
h3 { font-size: 1rem; line-height: 1.35; }
h1.top-title { font-size: 1.02rem; font-weight: 600; }
button, input, textarea, select { font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: inherit; font-weight: inherit; line-height: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}
.shell { min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 25;
  display: flex; align-items: center; gap: 8px;
  min-height: 64px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 0.98rem; white-space: nowrap; color: var(--ink); }
.mark {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  display: grid; place-items: center;
  background: var(--brand); color: var(--brand-ink);
}
.mark .ico { width: 15px; height: 15px; }
.top-title { font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.spacer { flex: 1; }
.section-label {
  display: none;
  font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.samplebar {
  background: var(--sample-bg); color: var(--sample-ink);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em;
  padding: 8px 20px;
}
.sample-pill, .demo, .pill {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 999px; font-weight: 600; white-space: nowrap; letter-spacing: 0.01em;
}
.sample-pill, .demo {
  background: var(--accent-bg); color: var(--gold-ink);
  border: 1px solid var(--line);
  font-size: 11px; min-height: 22px; padding: 0 7px;
}
.pill { font-size: 12px; min-height: 22px; padding: 0 8px; gap: 4px; }
.pill-new { background: var(--ok-bg); color: var(--ok); }
.pill-emergency, .pill-bad { background: var(--bad-bg); color: var(--bad); }
.pill-verified { background: #F6E7C1; color: #6B4E16; border: 1px solid #E4D0A0; }
:root[data-theme="dark"] .pill-verified { background: #3A3118; color: #F3D48A; border-color: #6A5424; }
.pill-ok { background: var(--ok-bg); color: var(--ok); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-muted { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.pill-trade { background: hsl(var(--hue) 42% 95%); color: hsl(var(--hue) 40% 28%); }
:root[data-theme="dark"] .pill-trade { background: hsl(var(--hue) 22% 20%); color: hsl(var(--hue) 62% 82%); }
.roles {
  display: flex; flex-shrink: 0; padding: 3px; gap: 2px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--field);
}
.roles button, .icon-btn, .back-btn {
  min-height: 40px; border: 0; background: transparent; color: var(--muted);
  padding: 0 12px; white-space: nowrap; font-weight: 600; border-radius: 8px;
}
.roles button { flex-shrink: 0; }
.roles button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
:root[data-theme="dark"] .roles button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); box-shadow: none; }
.icon-btn, .back-btn {
  border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; gap: 6px;
}
.main { padding: 28px 20px 148px; max-width: none; width: 100%; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.muted { color: var(--muted); }
.small { font-size: 0.92rem; }
.lead { margin: 2px 0 0; color: var(--muted); font-size: 1.02rem; }
.card, .notice, .summary-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.notice { box-shadow: none; }
button.notice {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  width: 100%; text-align: left; cursor: pointer;
}
.ico { width: 20px; height: 20px; display: block; }
.pin .ico { width: 16px; height: 16px; }
.notice-warn { background: var(--warn-bg); border-color: transparent; }
.notice-bad { background: var(--bad-bg); border-color: transparent; }
.notice-ok { background: var(--ok-bg); border-color: transparent; }
.summary-card { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); box-shadow: none; background: var(--accent-bg); }
.btn {
  min-height: 48px; border-radius: 10px; border: 1px solid transparent;
  padding: 10px 16px; font-weight: 600; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost { background: transparent; color: var(--brand); }
.btn-emergency { background: var(--emergency); color: var(--emergency-ink); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; }
.btn.auto { width: auto; }
.chip {
  min-height: 40px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 14px; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; }
.tile {
  height: 148px; min-height: 148px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); text-align: left; padding: 16px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px;
  font-weight: 600; box-shadow: var(--shadow);
}
.tile-name { display: block; width: 100%; white-space: normal; overflow-wrap: anywhere; line-height: 1.25; }
.more-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: stretch; }
.more-row .chip { width: 100%; height: 100%; white-space: normal; text-align: center; line-height: 1.25; justify-content: center; padding: 8px 12px; }
.more-row .chip:last-child:nth-child(odd) { grid-column: 1 / -1; }
.home-layout { display: block; }
.diary { scroll-margin-top: 96px; }
.diary-card { display: flex; flex-direction: column; gap: 12px; }
.diary h2 { font-size: 1.25rem; line-height: 1.25; }
.diary .between { align-items: center; }
.diary-list { display: flex; flex-direction: column; gap: 14px; max-height: 420px; overflow: auto; padding-right: 4px; }
.diary-day { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.diary-item { border-top: 1px solid var(--line); padding-top: 10px; }
.diary-item p { margin: 4px 0 0; }
.diary-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; }
@media (min-width: 1280px) {
  .home-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  .diary { scroll-margin-top: 88px; }
  .diary .day { min-height: 36px; min-width: 0; padding: 2px; font-size: 13px; }
  .diary .cal-card { padding: 10px; }
  .diary .icon-btn { min-height: 36px; padding: 0 8px; }
  .diary { position: sticky; top: 88px; }
  .diary-list { max-height: min(440px, calc(100vh - 560px)); }
}
.tile .bubble, .pin .bubble {
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center;
  background: hsl(var(--hue) 45% 95%);
  color: hsl(var(--hue) 42% 32%);
}
:root[data-theme="dark"] .tile .bubble { background: hsl(var(--hue) 18% 22%); color: hsl(var(--hue) 55% 80%); }
.count { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.92rem; }
input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="time"], textarea, select {
  width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--field); color: var(--ink); padding: 10px 12px; font-weight: 500;
}
textarea { min-height: 120px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; min-height: 40px; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--brand); flex: none; }
.progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--brand); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 0; }
.day {
  min-height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 500;
}
.day.asked { box-shadow: inset 0 0 0 1.5px var(--accent); }
.day[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.day[aria-disabled="true"] { opacity: 0.38; }
.dots { display: flex; gap: 3px; height: 6px; }
.dot { width: 5px; height: 5px; border-radius: 99px; }
.dot.filled { background: var(--brand); }
.day[aria-pressed="true"] .dot.filled { background: var(--brand-ink); }
.dot.outlined { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); }
.time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quote-grid { display: grid; gap: 16px; }
.price { font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.quote-facts { display: grid; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb {
  width: 128px; min-height: 96px; border-radius: 10px; padding: 10px;
  background: hsl(var(--hue, 217) 28% 32%); color: white;
  display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; font-weight: 500;
}
.tl { border-left: 1px solid var(--line); margin: 8px 0 0 6px; padding-left: 16px; }
.tl .ev { position: relative; margin: 0 0 14px; }
.tl .ev::before {
  content: ""; position: absolute; left: -20px; top: 7px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 0 0 2px var(--brand);
}
.map-stage { position: relative; background: var(--map); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.map-stage svg { width: 100%; height: auto; display: block; }
.pin {
  position: absolute; width: 36px; height: 36px; margin: 0; padding: 0;
  border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%);
  display: grid; place-items: center; color: white;
  background: hsl(var(--hue) 42% 38%);
  box-shadow: var(--shadow-md);
}
.pin.emergency { box-shadow: 0 0 0 3px var(--emergency); }
.pin.booked { border-radius: 6px; box-shadow: 0 0 0 3px var(--accent); }
.pin .mini { width: 16px; height: 16px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.header-actions .icon-btn,
.header-emergency {
  display: inline-flex; align-items: center; justify-content: center; gap: 0;
  flex: none; box-sizing: border-box;
  width: 40px; min-width: 40px; height: 40px; min-height: 40px; padding: 0;
  border-radius: 8px; font-weight: 600;
}
.header-emergency {
  border: 0;
  background: var(--emergency); color: var(--emergency-ink);
  box-shadow: 0 4px 10px rgba(190, 18, 60, 0.22);
}
.header-actions .ico { width: 18px; height: 18px; }
.header-emergency .em-label,
.header-actions .theme-label {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); border: 0;
}
@media (max-width: 480px) {
  .topbar .brand span:last-child {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); border: 0;
  }
  .roles button { padding: 0 8px; font-size: 13px; }
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button, .rail button.tab {
  position: relative; flex: 1; min-height: 62px; border: 0; background: transparent; color: var(--muted);
  font-size: 10px; font-weight: 600; white-space: nowrap; letter-spacing: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 0 4px;
}
.tabbar button .ico { width: 18px; height: 18px; }
.tabbar button[aria-current="page"] { color: var(--brand); }
.rail button.tab[aria-current="page"] { color: var(--brand); }
.badge {
  position: absolute; top: 6px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--emergency); color: var(--emergency-ink); font-size: 10px; font-weight: 600;
  display: grid; place-items: center;
}
.badge.dot { min-width: 8px; width: 8px; height: 8px; padding: 0; right: 12px; top: 8px; }
.rail { display: none; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px; z-index: 60;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px;
  max-width: min(420px, calc(100% - 32px)); font-weight: 500; box-shadow: var(--shadow-md);
}
.owner-link { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 40px; padding: 8px 0; font-weight: 500; }
ul.clean { margin: 8px 0 0; padding-left: 18px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (min-width: 720px) {
  .time-grid { grid-template-columns: repeat(6, 1fr); }
  .quote-grid { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 900px) {
  body { background: var(--bg); }
  .shell {
    display: grid; grid-template-columns: 248px minmax(0, 1fr);
    width: 100%;
    max-width: none;
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
  }
  .shell[data-screen="welcome"],
  .shell[data-screen="signin"],
  .shell[data-screen="register"],
  .shell[data-screen="checkmail"],
  .shell[data-screen="forgot"],
  .shell[data-screen="reset"],
  .shell[data-screen="terms"] { grid-template-columns: minmax(0, 1fr); }
  .workspace { min-width: 0; width: 100%; }
  .welcome-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.8fr); gap: 28px; width: 100%; align-items: stretch; }
  .welcome-layout .hero { min-height: 280px; display: flex; flex-direction: column; justify-content: center; }
  .rail {
    display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh;
    padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .rail .brand { padding: 4px 10px 18px; margin-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 1.02rem; }
  .rail button.tab {
    flex-direction: row; justify-content: flex-start; gap: 10px;
    font-size: 14.5px; min-height: 42px; border-radius: 10px; padding: 0 12px; white-space: nowrap;
  }
  .rail button.tab .ico { width: 18px; height: 18px; }
  .rail button.tab[aria-current="page"] { background: var(--accent-bg); }
  .rail button.tab .badge { position: static; margin-left: auto; }
  .tabbar { display: none; }
  .main { padding: 32px 32px 56px; max-width: none; width: 100%; }
  .section-label { display: block; }
  .toast { bottom: 24px; }
  .trade-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .more-row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .more-row .chip:last-child:nth-child(odd) { grid-column: auto; }
  .topbar { padding-left: 28px; padding-right: 28px; }
  .topbar .brand { display: none; }
}
.hero {
  position: relative; overflow: hidden; border-radius: 22px; padding: 28px 24px 24px; color: #fff;
  background:
    radial-gradient(90% 80% at 100% 0%, rgba(147, 197, 253, 0.45), transparent 46%),
    radial-gradient(70% 80% at 0% 100%, rgba(37, 99, 235, 0.35), transparent 50%),
    linear-gradient(128deg, #06122E 0%, #0E2A66 52%, #1D4ED8 100%);
  box-shadow: 0 18px 40px rgba(14, 42, 102, 0.28);
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1px);
  background-size: 16px 16px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.7), transparent 78%);
  animation: drift 22s linear infinite;
}
.hero > * { position: relative; }
.hero h1, .hero p, .hero .lead { color: #fff; }
.hero h1 { font-size: 2.45rem; text-shadow: 0 8px 24px rgba(0,0,0,.18); overflow-wrap: break-word; }
.hero p { overflow-wrap: break-word; }
.auth-panel { width: 100%; margin: 0; }
.auth-panel .card { max-width: 720px; }
.signed-as { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.demo-pair { display: grid; gap: 12px; }
@media (min-width: 640px) { .demo-pair { grid-template-columns: 1fr 1fr; } }
.demo-account { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--field); }
.demo-account h2 { font-size: 1.05rem; }
.rail .sign-out-tab { color: var(--ink); font-weight: 700; margin-top: 8px; }
.header-sign-out { width: auto; flex: none; min-height: 36px; padding: 0 10px; font-size: 0.85rem; }
@media (min-width: 900px) { .header-sign-out { display: none; } }
@media (max-width: 899px) { .topbar:has(.signed-as) .brand > span:last-child { display: none; } .signed-label { display: none; } .topbar .roles { display: none; } }
.eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #DBEAFE; }
.btn.request-bar {
  min-height: 64px;
  border-radius: 16px;
  padding: 16px 22px;
  font-size: 1.125rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  box-shadow: 0 12px 28px rgba(29, 78, 216, 0.32);
}
.hero-stat { margin: 12px 0 0; font-size: 1.05rem; color: #E0EAFF; }
.hero-stat strong { font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 2.6rem; font-weight: 500; line-height: 1; letter-spacing: -0.03em; color: #fff; margin-right: 6px; vertical-align: -6px; }
.dash { display: grid; gap: 12px; }
@media (min-width: 800px) { .dash { grid-template-columns: 1fr 1fr; } }
.notice.dash-card {
  flex-direction: row; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 10px 28px rgba(29, 78, 216, 0.08);
}
.dash-badge {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(160deg, #EFF6FF, #DBEAFE); color: #1D4ED8;
  box-shadow: inset 0 0 0 1px #BFDBFE;
}
.dash-card strong, .dash-card .small { display: block; }
@media (max-width: 700px) {
  .hero { padding: 22px 20px 18px; }
  .hero h1 { font-size: 2.05rem; }
  .btn.request-bar { min-height: 60px; font-size: 1.05rem; }
}
.tile {
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 14px 30px rgba(29, 78, 216, 0.08);
}
.tile .bubble {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(165deg, hsl(var(--hue) 85% 97%), hsl(var(--hue) 70% 88%));
  color: hsl(var(--hue) 55% 30%);
  box-shadow: inset 0 0 0 1px hsl(var(--hue) 45% 78%), 0 6px 14px hsl(var(--hue) 50% 40% / 0.18);
}
.tile:hover { transform: translateY(-3px); box-shadow: 0 18px 36px rgba(29, 78, 216, 0.16); }
.tile:active { transform: translateY(0) scale(0.985); }
.btn, .chip, .card, .notice, .tile { transition: transform .18s ease, box-shadow .18s ease, background .18s ease, filter .18s ease; }
.btn-primary {
  background: linear-gradient(180deg, #3B82F6 0%, #1D4ED8 100%);
  box-shadow: 0 8px 18px rgba(29, 78, 216, 0.28);
}
.btn-primary:hover { filter: brightness(1.05); }
.btn:active { transform: scale(0.985); }
.topbar {
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
}
.mark { background: #0E2A66; color: #F6E7C1; box-shadow: 0 6px 14px rgba(14, 42, 102, 0.28); }
.mark .logo { width: 16px; height: 16px; display: block; }
.quote {
  background: linear-gradient(180deg, #F5F9FF 0%, var(--surface) 38%);
  border-color: #D5E4FF;
  box-shadow: 0 12px 32px rgba(29, 78, 216, 0.1);
}
.price { color: #1E3A8A; }
.cal-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 14px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
}
.day { background: var(--bg); }
.day:hover { background: var(--accent-bg); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--brand); font-weight: 700; }
.skyline svg { display: block; width: 100%; height: 108px; }
.building-card { padding: 0; overflow: hidden; }
.building-body { padding: 18px 20px 20px; }
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
  padding: 28px 16px; border: 1px dashed #C7D7FE; border-radius: 16px;
  background: linear-gradient(180deg, #fff, #F4F8FF); color: var(--muted);
}
.empty .bubble {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(165deg, #EFF6FF, #DBEAFE); color: #1D4ED8;
}
.job-card { position: relative; overflow: hidden; }
.job-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, #1E3A8A, #60A5FA);
}
.hero.hero-photo {
  background-image:
    linear-gradient(105deg, rgba(6, 18, 46, 0.92) 0%, rgba(14, 42, 102, 0.78) 48%, rgba(29, 78, 216, 0.42) 100%),
    var(--hero);
  background-size: cover;
  background-position: center 40%;
}
.stat-grid { display: grid; gap: 12px; }
@media (min-width: 800px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
.stat {
  display: flex; gap: 14px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; box-shadow: 0 10px 28px rgba(14, 42, 102, 0.08); color: inherit; width: 100%;
}
button.stat { cursor: pointer; }
.stat-k { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat-v { margin: 2px 0; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1.7rem; font-weight: 500; letter-spacing: -0.02em; }
.ring { width: 64px; height: 64px; flex: none; }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 6; }
.ring-fg { fill: none; stroke: #1D4ED8; stroke-width: 6; stroke-linecap: round; }
.ring.gold .ring-fg { stroke: #C4A15A; }
.ring.teal .ring-fg { stroke: #0F766E; }
.avatar {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-weight: 700; color: #0E2A66;
  background: linear-gradient(160deg, hsl(var(--hue) 70% 94%), hsl(var(--hue) 45% 80%));
  box-shadow: inset 0 0 0 1px hsl(var(--hue) 40% 70%);
}
.who { display: flex; gap: 12px; align-items: center; }
.photo-banner { position: relative; min-height: 140px; background: #0E2A66; }
.photo-banner .skyline { position: absolute; inset: 0; }
.photo-banner img { position: relative; z-index: 1; display: block; width: 100%; height: 156px; object-fit: cover; }
.success {
  text-align: center; padding: 36px 24px;
  background:
    radial-gradient(80% 60% at 50% 0%, rgba(196, 161, 90, 0.2), transparent 60%),
    linear-gradient(180deg, #0E2A66, #1D4ED8);
  color: #fff; border-radius: 22px;
  box-shadow: 0 18px 40px rgba(14, 42, 102, 0.28);
}
.success h1, .success p { color: #fff; }
.success .btn { margin-top: 16px; background: #fff; color: #0E2A66; }
.stage { position: relative; animation: rise .32s ease; }
.skel {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
  display: grid; gap: 12px; animation: skel-out .55s ease forwards;
}
.skel span {
  display: block; height: 18px; border-radius: 9px;
  background: linear-gradient(90deg, #E6EEF8 0%, #F8FBFF 45%, #E6EEF8 100%);
  background-size: 200% 100%; animation: shimmer 1s linear infinite;
}
.skel span:nth-child(1) { height: 92px; }
.skel span:nth-child(2) { width: 70%; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes skel-out { 0% { opacity: .95; } 55% { opacity: .7; } 100% { opacity: 0; visibility: hidden; } }
@keyframes drift { from { background-position: 0 0; } to { background-position: 32px 16px; } }
:root[data-theme="dark"] .skel span { background: linear-gradient(90deg, #132844, #1E3A5C, #132844); background-size: 200% 100%; }
:root[data-theme="dark"] .ring-fg { stroke: #93C5FD; }
:root[data-theme="dark"] .ring.gold .ring-fg { stroke: #E4C36A; }
:root[data-theme="dark"] .avatar { color: #E8F0FA; }
:root[data-theme="dark"] .btn-primary { background: linear-gradient(180deg, #DBEAFE, #93C5FD); color: #0B1020; }
:root[data-theme="dark"] .btn.request-bar { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); }
:root[data-theme="dark"] .tile .bubble {
  background: linear-gradient(165deg, hsl(var(--hue) 32% 26%), hsl(var(--hue) 28% 16%));
  color: hsl(var(--hue) 70% 88%);
  box-shadow: inset 0 0 0 1px hsl(var(--hue) 30% 34%);
}
:root[data-theme="dark"] .empty { background: #121826; border-color: #334155; }
:root[data-theme="dark"] .dash-badge, :root[data-theme="dark"] .empty .bubble { background: #172033; color: #93C5FD; box-shadow: none; }
:root[data-theme="dark"] .quote { background: linear-gradient(180deg, #172033, var(--surface) 46%); border-color: #243044; }
:root[data-theme="dark"] .price { color: #DBEAFE; }
:root[data-theme="dark"] .cal-card { box-shadow: none; }
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}
</style>

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function uid(p) { state.seq += 1; return p + state.seq; }
  function tradeById(id) { return ALL_TRADES.find(t => t.id === id) || ALL_TRADES[ALL_TRADES.length - 1]; }
  function suburbByName(name) { return SUBURBS.find(s => s.name === name); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO() { return fmtISO(new Date()); }
  function parseISO(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
  function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return fmtISO(d); }
  function dow(iso) { return parseISO(iso).getDay(); }
  function isWeekend(iso) { const d = dow(iso); return d === 0 || d === 6; }
  function fmtDateLong(iso) { const d = parseISO(iso); return DOW[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
  function fmtDateShort(iso) { const d = parseISO(iso); const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]; return d.getDate() + " " + mon + " " + d.getFullYear(); }
  function toMins(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
  function fromMins(mins) { const h = Math.floor(mins / 60); const m = mins % 60; return pad(h) + ":" + pad(m); }
  function addMinutes(hhmm, mins) { return fromMins(toMins(hhmm) + mins); }
  function fmtTime(hhmm) {
    if (!hhmm) return "";
    let [h, m] = hhmm.split(":").map(Number);
    const ap = h >= 12 ? "pm" : "am";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + pad(m) + " " + ap;
  }
  function fmtClock(ts) { const d = new Date(ts); return fmtTime(pad(d.getHours()) + ":" + pad(d.getMinutes())); }
  function fmtStamp(ts) { const d = new Date(ts); return fmtDateShort(fmtISO(d)) + ", " + fmtClock(ts); }
  function ago(ts) {
    const min = Math.round((Date.now() - ts) / 60000);
    if (min < 1) return "Just now";
    if (min < 60) return min === 1 ? "1 minute ago" : min + " minutes ago";
    const hr = Math.round(min / 60);
    if (hr < 24) return hr === 1 ? "1 hour ago" : hr + " hours ago";
    const day = Math.round(hr / 24);
    return day === 1 ? "1 day ago" : day + " days ago";
  }
  function money(n) {
    const v = Math.round(Number(n) * 100) / 100;
    return v.toLocaleString("en-AU", { style: "currency", currency: "AUD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function moneyShort(n) {
    const v = Math.round(Number(n) * 100) / 100;
    const whole = Math.abs(v - Math.round(v)) < 0.001;
    return v.toLocaleString("en-AU", { style: "currency", currency: "AUD", minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: 2 });
  }
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371, p = Math.PI / 180;
    const dLat = (lat2 - lat1) * p, dLon = (lon2 - lon1) * p;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * p) * Math.cos(lat2 * p) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(Math.min(1, a)));
  }
  function kmFromCbd(lat, lng) { return haversine(lat, lng, CBD.lat, CBD.lng); }

  function upcomingWeekdays(count, offset) {
    const out = []; let i = offset || 0;

      i += 1;

  let lastFocus = null;
  function render(opts) {
    opts = opts || {};
    const y = opts.keepScroll ? window.scrollY : 0;
    if (opts.keepFocus) {
      const a = document.activeElement;
      if (a && a.dataset && a.dataset.field) lastFocus = { field: a.dataset.field, start: a.selectionStart, end: a.selectionEnd };
    } else lastFocus = null;
    applyTheme();
    document.getElementById("app").innerHTML = shell();
    if (opts.keepScroll) window.scrollTo(0, y);
    else window.scrollTo(0, 0);
    if (lastFocus) {
      const el = document.querySelector('[data-field="' + lastFocus.field + '"]');
      if (el) {
        el.focus();
        if (typeof lastFocus.start === "number" && el.setSelectionRange) {
          try { el.setSelectionRange(lastFocus.start, lastFocus.end); } catch (e) { /* ignore */ }
        }
      }
    }
    const offer = document.getElementById("offer-form");
    if (opts.scrollOffer && offer) offer.scrollIntoView({ block: "start" });
  }

  function tileHue(id) {
    const blues = [214, 222, 206, 230, 198, 218, 236, 190];
    const i = POPULAR_IDS.indexOf(id);
    return blues[i === -1 ? 0 : i];
  }
  function emptyState(message) {
    return '<div class="empty"><span class="bubble">' + icon("clipboard") + "</span><p>" + message + "</p></div>";
  }
  function skyline(id) {
    const n = String(id).split("").reduce((a, c) => a + c.charCodeAt(0), 0);
    const gid = "sky" + String(id).replace(/[^a-z0-9]/gi, "");
    const towers = [0, 1, 2, 3, 4].map(i => {
      const h = 26 + ((n + i * 19) % 40);
      const x = 16 + i * 60;
      const y = 84 - h;
      let windows = "";
      for (let r = 0; r < Math.floor(h / 12); r++) {
        windows += '<rect x="' + (x + 8) + '" y="' + (y + 8 + r * 12) + '" width="7" height="5" rx="1" fill="rgba(255,255,255,.8)"/>';
        windows += '<rect x="' + (x + 22) + '" y="' + (y + 8 + r * 12) + '" width="7" height="5" rx="1" fill="rgba(255,255,255,.55)"/>';
      }
      return '<rect x="' + x + '" y="' + y + '" width="42" height="' + h + '" rx="3" fill="rgba(255,255,255,.18)"/>' + windows;
    }).join("");
    return '<div class="skyline" aria-hidden="true"><svg viewBox="0 0 320 84" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#071633"/><stop offset="58%" stop-color="#163A86"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient></defs><rect width="320" height="84" fill="url(#' + gid + ')"/><circle cx="262" cy="20" r="14" fill="rgba(255,255,255,.2)"/>' + towers + "</svg></div>";
  }
  function buildingBanner(b) {
    const src = (typeof PHOTOS !== "undefined" && PHOTOS[b.id]) || "";

    return '<div class="photo-banner">' + skyline(b.id) + '<img src="' + src + '" alt="" onerror="this.remove()"></div>';
  }

  function ownJobs() { return state.jobs.filter(j => j.owned); }
  function heldStages() { return ["paid", "onsite", "review0", "fix1", "review1", "fix2"]; }
  function quoteTotal(list) {
    return list.reduce((sum, job) => {
      const q = quoteById(job.awardedQuoteId);
      return sum + (q ? q.price : 0);
    }, 0);
  }
  function upcomingOwn() {
    return ownJobs().filter(job => {
      if (heldStages().indexOf(job.stage) === -1 && job.stage !== "approved") return false;
      const q = quoteById(job.awardedQuoteId);
      const date = (q && q.date) || job.date;
      return date && date >= todayISO();
    });
  }

    const held = quoteTotal(owned.filter(j => heldStages().indexOf(j.stage) !== -1));

  function loadNotes() {
    try {
      const raw = localStorage.getItem("strata-notes");
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : null;
    } catch (e) { return null; }
  }
  function saveNotes() {
    try { localStorage.setItem("strata-notes", JSON.stringify(state.notes)); } catch (e) { /* storage unavailable */ }
  }
  function seedNotes() {
    state.noteDraft = state.noteDraft || "";
    state.noteDay = state.noteDay || "all";
    const saved = loadNotes();
    if (saved) { state.notes = saved; return; }
    const today = todayISO();
    const yesterday = addDays(today, -1);
    const older = addDays(today, -2);
    const now = Date.now();
    const start = parseISO(today).getTime();
    function onThisDay(minsAgo, fallbackMins) {
      const at = now - minsAgo * 60000;
      return at >= start ? at : start + fallbackMins * 60000;
    }
    function atClock(iso, hh, mm) {
      const d = parseISO(iso);
      d.setHours(hh, mm, 0, 0);
      return d.getTime();
    }
    state.notes = [
      { id: "n1", date: today, at: onThisDay(25, 8), author: "Mina Costa", text: "Handover: the leak in unit 12 is with the plumber. Sam Okonkwo is due back tomorrow morning. Please confirm he arrives.", sample: true },
      { id: "n2", date: today, at: onThisDay(70, 2), author: "Jordan Hale", text: "Committee note: the stairwell painting waits until the committee meets on Tuesday.", sample: true },
      { id: "n3", date: yesterday, at: atClock(yesterday, 16, 40), author: "Alex Nguyen", text: "Contractor arrival: Sam Okonkwo finished the lobby door closer. The plant-room key at Harbour View was returned to the concierge.", sample: true },
      { id: "n4", date: older, at: atClock(older, 11, 15), author: "Mina Costa", text: "Follow-up: Balwyn Gardens has two quotes for the garden tap. Please compare them before anyone approves.", sample: true }
    ];
    saveNotes();
  }

  function calendarDots(role) {
    const dots = {};
    state.jobs.forEach(job => {
      const date = (job.awardedQuoteId && quoteById(job.awardedQuoteId) && quoteById(job.awardedQuoteId).date) || job.date;
      if (!date) return;
      if (role === "manager" && !job.owned) return;
      if (role === "contractor") {
        const mine = job.awardedTo === state.meId || quotesFor(job.id).some(q => q.contractorId === state.meId);
        if (!mine) return;
      }
      const booked = ["paid", "onsite", "review0", "fix1", "review1", "fix2", "released"].indexOf(job.stage) !== -1;
      const requested = job.stage === "open" || job.stage === "approved";
      const prev = dots[date] || { booked: false, requested: false };
      if (booked) prev.booked = true;
      if (requested) prev.requested = true;
      dots[date] = prev;
    });
    return dots;
  }

  function renderMonth(opts) {
    const year = opts.year, month = opts.month;
    const firstDow = new Date(year, month, 1).getDay();
    const lead = (firstDow + 6) % 7;
    const daysIn = new Date(year, month + 1, 0).getDate();
    let html = '<div class="between"><button class="icon-btn" type="button" data-act="' + opts.nav + '" data-dir="-1" aria-label="Previous month">Prev</button><strong>' + MONTHS[month] + " " + year + '</strong><button class="icon-btn" type="button" data-act="' + opts.nav + '" data-dir="1" aria-label="Next month">Next</button></div>';
    html += '<div class="cal">' + DOW_SHORT.map(d => '<div class="dow">' + d + "</div>").join("");
    for (let i = 0; i < lead; i++) html += "<div></div>";
    for (let d = 1; d <= daysIn; d++) {
      const iso = year + "-" + pad(month + 1) + "-" + pad(d);
      const dis = opts.disable ? opts.disable(iso) : "";
      const dots = (opts.dots && opts.dots[iso]) || {};
      const pressed = opts.selected === iso;
      const asked = opts.asked === iso;
      let label = fmtDateLong(iso);
      if (dis) label += ", " + dis;
      if (dots.booked) label += ", " + (opts.mark || "booked job");
      if (dots.requested) label += ", date waiting for a quote";
      if (pressed) label += ", selected";
      const dotHtml = '<span class="dots">' + (dots.booked ? '<span class="dot filled"></span>' : "") + (dots.requested ? '<span class="dot outlined"></span>' : "") + "</span>";
      const today = iso === todayISO();
      if (today) label += ", today";
      html += '<button type="button" class="day' + (asked ? " asked" : "") + (today ? " today" : "") + '" data-act="' + opts.pick + '" data-date="' + iso + '" aria-pressed="' + (pressed ? "true" : "false") + '" aria-disabled="' + (dis ? "true" : "false") + '" aria-label="' + esc(label) + '" data-reason="' + esc(dis) + '">' + d + dotHtml + "</button>";
    }
    html += "</div>";
    return '<div class="cal-card">' + html + "</div>";
  }

  function calendarScreen() {
    const role = state.role;
    const dots = calendarDots(role);
    const selected = state.cal.selected;
    let panel = "";
    if (selected) {
      const items = state.jobs.filter(job => {
        const date = (quoteById(job.awardedQuoteId) || {}).date || job.date;
        if (date !== selected) return false;
        if (role === "manager") return job.owned;
        return job.awardedTo === state.meId || quotesFor(job.id).some(q => q.contractorId === state.meId);
      });
      const rows = items.map(job => {
        const q = quoteById(job.awardedQuoteId);
        const p = placeOf(job);
        let when = whenText(job);
        if (q) when = rangeText(q.date, q.time, q.duration, p.open, p.close);
        return '<button class="btn btn-secondary" type="button" data-act="open-job" data-id="' + job.id + '">' + esc(job.title) + " · " + esc(when) + "</button>";
      }).join("") || emptyState("Nothing on this day.");
      let book = "";
      if (role === "manager") {
        const closed = dayClosedForAll(selected);
        book = closed
          ? '<p role="alert">Contractors are not on site this day. Buildings are closed to contractors.</p>'
          : '<button class="btn btn-primary" type="button" data-act="book-day" data-date="' + selected + '">Book a job for this day</button>';
      }
      panel = '<div class="card stack"><h2>' + esc(fmtDateLong(selected)) + "</h2>" + rows + book + "</div>";
    }
    return '<div class="stack"><h1>Calendar</h1><p class="small muted">Filled dots are booked jobs. Outlined dots are dates still waiting for a quote.</p>' +
      renderMonth({ year: state.cal.year, month: state.cal.month, selected: selected, dots: dots, pick: "cal-day", nav: "cal-nav", disable: () => "" }) + panel + "</div>";
  }
  function dayClosedForAll(iso) {
    if (!isWeekend(iso)) return false;
    const usable = state.buildings.filter(b => inRadius(b.lat, b.lng));
    return usable.length > 0 && usable.every(b => !b.weekends);
  }

  function requestScreen() {

  function mediaThumbs(items, hue) {
    return items.map(item => '<div class="thumb" style="--hue:' + (item.hue || hue || 168) + '"><span>' + (item.kind === "video" ? "Video" : "Photo") + "</span><span>" + esc(fmtStamp(item.at)) + (item.distanceM != null ? " · " + item.distanceM + " m" : "") + (item.seconds ? " · " + item.seconds + " seconds" : "") + "</span></div>").join("");

  function yn(name, i, value) {
    return '<div class="row" role="group" aria-label="' + esc(name) + '"><button class="chip" type="button" data-act="safety" data-i="' + i + '" data-v="yes" aria-pressed="' + (value === "yes" ? "true" : "false") + '">Yes</button><button class="chip" type="button" data-act="safety" data-i="' + i + '" data-v="no" aria-pressed="' + (value === "no" ? "true" : "false") + '">No</button></div>';

  function step3(d) {
    const b = building(d.buildingId);

    const modes = [
      ["morning", b ? "Morning (" + prettyHours(b.open, "12:00") + ")" : "Morning"],
      ["afternoon", b ? "Afternoon (12 pm to " + fmtTime(b.close).replace(":00 ", " ") + ")" : "Afternoon"],
      ["anytime", b ? "Any time (" + prettyHours(b.open, b.close) + ")" : "Any time"]

    const deadlines = [["today", "Today"], ["tomorrow", "Tomorrow"], ["3", "In 3 days"], ["7", "In 7 days"]].map(x => '<button class="chip" type="button" data-act="deadline" data-v="' + x[0] + '" aria-pressed="' + (d.deadline === x[0] ? "true" : "false") + '">' + x[1] + "</button>").join("");

  function validateStep(d) {
    const b = building(d.buildingId);
    if (state.step === 1) {
      if (!b) return "Choose a building.";
      if (!inRadius(b.lat, b.lng)) return "We do not cover this area yet.";
      if (!d.area.trim()) return "Add the level, unit or area.";
    }
    if (state.step === 2) {
      if (!d.title.trim()) return "Add a job title.";
      if (d.tradeId === "other" && !d.otherTrade.trim()) return "Describe the other service.";
    }
    if (state.step === 3) {
      if (d.safety.some(v => v !== "yes" && v !== "no")) return "Answer every safety question.";
      if (d.safety[2] === "yes") return "A licensed assessor must clear possible asbestos before any work.";
      if (!d.parking) return "Choose parking: Yes, No or Limited.";
      if (d.parking === "limited" && !d.parkingNote.trim()) return "Add a short parking note.";
      if (!d.lift) return "Say if there is a lift or a loading dock.";
    }
    if (state.step === 4) {
      if (!d.date) return "Choose a date.";
      if (draftClosed(d, d.date)) return "That day is not available.";
      if (!d.timeMode && !d.exactTime) return "Choose a time.";
      if (!d.deadline) return "Choose a quote deadline.";
      if (!d.materials) return "Say who supplies materials.";
      if (!d.notice) return "Choose a notice to residents.";
    }
    if (state.step === 5) {
      if (!d.approver.trim()) return "Add the approving person.";
      if (!d.invoiceTo.trim()) return "Add who the invoice is to.";
    }
    return "";
  }
  function postDraft() {
    if (state.remote && window.StrataWire) return window.StrataWire.postDraft();
    const d = state.draft;
    for (let s = 1; s <= 5; s++) {
      state.step = s;
      const err = validateStep(d);
      if (err) { toast(err); render(); return; }
    }
    const b = building(d.buildingId);
    const job = {
      id: uid("job"), owned: true, sample: false, buildingId: b.id, area: d.area.trim(), title: d.title.trim(),
      tradeId: d.tradeId, otherTrade: d.otherTrade.trim(), instructions: d.instructions.trim(),
      photos: d.photos, video: d.video, safety: d.safety.slice(), safetyNote: d.safetyNote.trim(),
      parking: d.parking === "yes" ? "Yes" : d.parking === "no" ? "No" : "Limited", parkingNote: d.parkingNote.trim(),
      siteRules: d.siteRules.trim(), urgency: d.urgency, date: d.date, timeMode: d.exactTime ? "exact" : d.timeMode,
      exactTime: d.exactTime, flexible: d.flexible, deadline: d.deadline, materials: d.materials,
      insurance: Number(d.insurance), swms: !!d.swms, notice: d.notice, lift: d.lift,
      reference: d.reference.trim(), approver: d.approver.trim(), invoiceTo: d.invoiceTo.trim(), invoiceAbn: d.invoiceAbn.trim(),
      access: d.access.trim(), phone: state.manager.phone, postedAt: Date.now(), stage: "open",
      arrival: null, eta: null, arrivalAt: null, arrivalDistance: null, arrivalConfirmed: false,
      safetyOnSite: [null, null, null, null, null], contractorAlert: false, alertSeen: false,
      awardedQuoteId: null, awardedTo: null, paidAt: null, payMethod: null, challenges: [],
      evidence: { before: [], after: [], fix1: [], fix2: [] }, timeline: [], releasedAt: null, reviewStartedAt: null, farDemo: false
    };
    log(job, "Request posted.");
    state.jobs.unshift(job);
    state.draft = null;
    toast("Request posted.");

    state.screen = "job";

  }

  function managerJob(job) {

  function arrivalCard(job) {

  function compareQuotes(job) {
    const p = placeOf(job);

        '<div class="quote-facts"><p>Start: ' + esc(fmtDateLong(q.date)) + " at " + esc(fmtTime(q.time)) + "</p>" +

        '<button class="btn btn-ghost" type="button" data-act="open-person" data-id="' + c.id + '">View profile</button>' +
        '<button class="btn btn-primary" type="button" data-act="approve" data-id="' + q.id + '"' + (canApprove ? "" : " disabled") + ">Approve " + moneyShort(q.price) + " of " + moneyShort(p.limit) + "</button></article>";

  function approveScreen() {

  function foundJobs() {
    const q = state.find.q.trim().toLowerCase();
    return openJobs().filter(job => {
      if (jobKm(job) > state.find.distance + 0.001) return false;
      if (state.find.trade !== "all" && job.tradeId !== state.find.trade) return false;
      if (!q) return true;
      const trade = tradeById(job.tradeId);
      const hay = (job.title + " " + placeOf(job).suburb + " " + placeOf(job).street + " " + trade.name + " " + (job.otherTrade || "")).toLowerCase();
      if (hay.indexOf(q) !== -1) return true;
      const words = q.split(/\s+/);
      return words.some(w => ALL_TRADES.some(t => t.words.indexOf(w) !== -1 && t.id === job.tradeId));
    });
  }
  function sortFound(list) {
    const cmp = state.find.sort === "closest" ? (a, b) => jobKm(a) - jobKm(b) : (a, b) => b.postedAt - a.postedAt;
    const em = list.filter(isEmergency).sort(cmp);
    const rest = list.filter(j => !isEmergency(j)).sort(cmp);
    return em.concat(rest);
  }

    const c = me();
    if (!offersTrade(c, job.tradeId)) return "outside";

  function findJobs() {
    const f = state.find;
    const tradeName = f.trade === "all" ? "All trades" : tradeById(f.trade).name;
    const summary = "Within " + f.distance + " km · " + tradeName;
    const list = sortFound(foundJobs());
    const body = f.view === "map" ? mapHtml(list) : list.map(contractorCard).join("") || emptyState("No jobs match.");
    const filters = f.filtersOpen ? '<div class="card stack"><span class="field">Distance</span><div class="row">' + [3, 5, 8, 12].map(n => '<button class="chip" type="button" data-act="distance" data-v="' + n + '" aria-pressed="' + (f.distance === n ? "true" : "false") + '">' + n + " km</button>").join("") + "</div>" +
      '<span class="field">Trade</span><div class="row"><button class="chip" type="button" data-act="find-trade" data-trade="all" aria-pressed="' + (f.trade === "all" ? "true" : "false") + '">All</button>' + ALL_TRADES.map(t => '<button class="chip" type="button" data-act="find-trade" data-trade="' + t.id + '" aria-pressed="' + (f.trade === t.id ? "true" : "false") + '">' + esc(t.name) + "</button>").join("") + "</div></div>" : "";
    return '<div class="stack"><h1>Find jobs</h1><div class="row" role="group" aria-label="List or map"><button class="chip" type="button" data-act="find-view" data-v="list" aria-pressed="' + (f.view === "list" ? "true" : "false") + '">List</button><button class="chip" type="button" data-act="find-view" data-v="map" aria-pressed="' + (f.view === "map" ? "true" : "false") + '">Map</button></div>' +
      '<label class="field" for="find-q">Search<input id="find-q" type="text" data-field="find.q" value="' + esc(f.q) + '" placeholder="tap, leak, old sofa"></label>' +

  function project(lat, lng) {
    const dx = (lng - CBD.lng) * 111 * Math.cos(CBD.lat * Math.PI / 180);
    const dy = (lat - CBD.lat) * 111;
    const scale = 150 / Math.max(8, state.owner.radiusKm);
    return { x: 180 + dx * scale, y: 200 - dy * scale };
  }
  function layoutPins(pins) {
    const placed = [];
    pins.forEach(p => {
      let x = p.x, y = p.y, tries = 0;
      while (placed.some(q => Math.hypot(q.x - x, q.y - y) < 28) && tries < 24) {
        const ang = tries * 1.35;
        const rad = 18 + tries * 3;
        x = p.x + Math.cos(ang) * rad;
        y = p.y + Math.sin(ang) * rad;
        tries += 1;
      }
      placed.push(Object.assign({}, p, { x: x, y: y }));
    });
    return placed;
  }
  function mapHtml(list) {
    const pins = list.map(job => {
      const p = placeOf(job);

    });
    if (state.find.showBooked) {
      state.jobs.forEach(job => {

    }
    const laid = layoutPins(pins);

        '<text x="' + (180 + r + 2) + '" y="196" font-size="10" fill="var(--muted)">' + km + " km</text>";

      '<button class="chip" type="button" data-act="show-booked" aria-pressed="' + (state.find.showBooked ? "true" : "false") + '">Show my booked jobs</button>' + preview + "</div>";
  }

  function blockReason(job) {

      [["none", "Paid after the work"], ["25", "25% deposit"], ["30", "30% deposit"], ["50", "50% deposit"]].map(pair => '<button class="chip" type="button" data-act="deposit-type" data-v="' + pair[0] + '" aria-pressed="' + ((o.depositType || "none") === pair[0] ? "true" : "false") + '">' + pair[1] + "</button>").join("") + "</div>" +
