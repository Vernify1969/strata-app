<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Strata App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F8FB;
  --surface: #FFFFFF;
  --ink: #0F172A;
  --muted: #475569;
  --line: #E2E8F0;
  --brand: #1D4ED8;
  --brand-ink: #FFFFFF;
  --accent: #1D4ED8;
  --accent-bg: #EFF6FF;
  --gold: #1D4ED8;
  --gold-ink: #1E3A8A;
  --field: #F8FAFC;
  --ok: #047857;
  --ok-bg: #ECFDF5;
  --warn: #92400E;
  --warn-bg: #FFFBEB;
  --bad: #9F1239;
  --bad-bg: #FFF1F2;
  --emergency: #BE123C;
  --emergency-ink: #FFFFFF;
  --sample-bg: #F1F5F9;
  --sample-ink: #334155;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
  --map: #EEF3F9;
  --river: #93B4D4;
  --grid: #D9E3EE;
}
:root[data-theme="dark"] {
  --bg: #0B1020;
  --surface: #121826;
  --ink: #F8FAFC;
  --muted: #CBD5E1;
  --line: #243044;
  --brand: #93C5FD;
  --brand-ink: #0B1020;
  --accent: #93C5FD;
  --accent-bg: #172033;
  --gold: #93C5FD;
  --gold-ink: #DBEAFE;
  --field: #0F1626;
  --ok: #6EE7B7;
  --ok-bg: #064E3B;
  --warn: #FCD34D;
  --warn-bg: #422006;
  --bad: #FECDD3;
  --bad-bg: #4C0519;
  --emergency: #BE123C;
  --emergency-ink: #FFFFFF;
  --sample-bg: #172033;
  --sample-ink: #CBD5E1;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.35);
  --map: #0E1524;
  --river: #3D6490;
  --grid: #1E2A3E;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Inter, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
}
h1, h2 {
  font-family: Newsreader, Georgia, serif;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0;
}
h1 { font-size: 2.15rem; line-height: 1.15; }
h2 { font-size: 1.55rem; line-height: 1.25; }
h3, .brand, .top-title, .price {
  font-family: Inter, "Segoe UI", sans-serif;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
}
h3 { font-size: 1rem; line-height: 1.35; }
h1.top-title { font-size: 1.02rem; font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}
.shell { min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 25;
  display: flex; align-items: center; gap: 8px;
  min-height: 64px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 0.98rem; white-space: nowrap; color: var(--ink); }
.mark {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  display: grid; place-items: center;
  background: var(--brand); color: var(--brand-ink);
}
.mark .ico { width: 15px; height: 15px; }
.top-title { font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.spacer { flex: 1; }
.section-label {
  display: none;
  font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.samplebar {
  background: var(--sample-bg); color: var(--sample-ink);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em;
  padding: 8px 20px;
}
.sample-pill, .demo, .pill {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 999px; font-weight: 600; white-space: nowrap; letter-spacing: 0.01em;
}
.sample-pill, .demo {
  background: var(--accent-bg); color: var(--gold-ink);
  border: 1px solid var(--line);
  font-size: 11px; min-height: 22px; padding: 0 7px;
}
.pill { font-size: 12px; min-height: 22px; padding: 0 8px; gap: 4px; }
.pill-new { background: var(--ok-bg); color: var(--ok); }
.pill-emergency, .pill-bad { background: var(--bad-bg); color: var(--bad); }
.pill-verified { background: var(--accent-bg); color: var(--gold-ink); }
.pill-ok { background: var(--ok-bg); color: var(--ok); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-muted { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.pill-trade { background: hsl(var(--hue) 42% 95%); color: hsl(var(--hue) 40% 28%); }
:root[data-theme="dark"] .pill-trade { background: hsl(var(--hue) 22% 20%); color: hsl(var(--hue) 62% 82%); }
.roles {
  display: flex; flex-shrink: 0; padding: 3px; gap: 2px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--field);
}
.roles button, .icon-btn, .back-btn {
  min-height: 40px; border: 0; background: transparent; color: var(--muted);
  padding: 0 12px; white-space: nowrap; font-weight: 600; border-radius: 8px;
}
.roles button { flex-shrink: 0; }
.roles button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
:root[data-theme="dark"] .roles button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); box-shadow: none; }
.icon-btn, .back-btn {
  border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; gap: 6px;
}
.main { padding: 28px 20px 148px; max-width: 1120px; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.muted { color: var(--muted); }
.small { font-size: 0.92rem; }
.lead { margin: 2px 0 0; color: var(--muted); font-size: 1.02rem; }
.card, .notice, .summary-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.notice { box-shadow: none; }
button.notice {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  width: 100%; text-align: left; cursor: pointer;
}
.ico { width: 20px; height: 20px; display: block; }
.pin .ico { width: 16px; height: 16px; }
.notice-warn { background: var(--warn-bg); border-color: transparent; }
.notice-bad { background: var(--bad-bg); border-color: transparent; }
.notice-ok { background: var(--ok-bg); border-color: transparent; }
.summary-card { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); box-shadow: none; background: var(--accent-bg); }
.btn {
  min-height: 48px; border-radius: 10px; border: 1px solid transparent;
  padding: 10px 16px; font-weight: 600; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost { background: transparent; color: var(--brand); }
.btn-emergency { background: var(--emergency); color: var(--emergency-ink); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; }
.btn.auto { width: auto; }
.chip {
  min-height: 40px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 14px; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  min-height: 118px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); text-align: left; padding: 16px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px;
  font-weight: 600; box-shadow: var(--shadow);
}
.tile .bubble, .pin .bubble {
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center;
  background: hsl(var(--hue) 45% 95%);
  color: hsl(var(--hue) 42% 32%);
}
:root[data-theme="dark"] .tile .bubble { background: hsl(var(--hue) 18% 22%); color: hsl(var(--hue) 55% 80%); }
.count { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.92rem; }
input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="time"], textarea, select {
  width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--field); color: var(--ink); padding: 10px 12px; font-weight: 500;
}
textarea { min-height: 120px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; min-height: 40px; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--brand); flex: none; }
.progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--brand); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 0; }
.day {
  min-height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 500;
}
.day.asked { box-shadow: inset 0 0 0 1.5px var(--accent); }
.day[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.day[aria-disabled="true"] { opacity: 0.38; }
.dots { display: flex; gap: 3px; height: 6px; }
.dot { width: 5px; height: 5px; border-radius: 99px; }
.dot.filled { background: var(--brand); }
.day[aria-pressed="true"] .dot.filled { background: var(--brand-ink); }
.dot.outlined { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); }
.time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quote-grid { display: grid; gap: 16px; }
.price { font-family: Newsreader, Georgia, serif; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.quote-facts { display: grid; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb {
  width: 128px; min-height: 96px; border-radius: 10px; padding: 10px;
  background: hsl(var(--hue, 217) 28% 32%); color: white;
  display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; font-weight: 500;
}
.tl { border-left: 1px solid var(--line); margin: 8px 0 0 6px; padding-left: 16px; }
.tl .ev { position: relative; margin: 0 0 14px; }
.tl .ev::before {
  content: ""; position: absolute; left: -20px; top: 7px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 0 0 2px var(--brand);
}
.map-stage { position: relative; background: var(--map); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.map-stage svg { width: 100%; height: auto; display: block; }
.pin {
  position: absolute; width: 36px; height: 36px; margin: 0; padding: 0;
  border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%);
  display: grid; place-items: center; color: white;
  background: hsl(var(--hue) 42% 38%);
  box-shadow: var(--shadow-md);
}
.pin.emergency { box-shadow: 0 0 0 3px var(--emergency); }
.pin.booked { border-radius: 6px; box-shadow: 0 0 0 3px var(--accent); }
.pin .mini { width: 16px; height: 16px; }
.fab {
  position: fixed; right: 16px; bottom: 84px; z-index: 35;
  min-height: 44px; border-radius: 10px; border: 0; padding: 0 14px;
  background: var(--emergency); color: var(--emergency-ink); font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 8px 20px rgba(190, 18, 60, 0.28);
}
.fab .ico { width: 16px; height: 16px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button, .rail button.tab {
  position: relative; flex: 1; min-height: 62px; border: 0; background: transparent; color: var(--muted);
  font-size: 10px; font-weight: 600; white-space: nowrap; letter-spacing: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 0 4px;
}
.tabbar button .ico { width: 18px; height: 18px; }
.tabbar button[aria-current="page"] { color: var(--brand); }
.rail button.tab[aria-current="page"] { color: var(--brand); }
.badge {
  position: absolute; top: 6px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--emergency); color: var(--emergency-ink); font-size: 10px; font-weight: 600;
  display: grid; place-items: center;
}
.badge.dot { min-width: 8px; width: 8px; height: 8px; padding: 0; right: 12px; top: 8px; }
.rail { display: none; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px; z-index: 60;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px;
  max-width: min(420px, calc(100% - 32px)); font-weight: 500; box-shadow: var(--shadow-md);
}
.owner-link { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 40px; padding: 8px 0; font-weight: 500; }
ul.clean { margin: 8px 0 0; padding-left: 18px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 430px) {
  .theme-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
  .icon-btn { width: 40px; min-width: 40px; flex: none; padding: 0; justify-content: center; }
}
@media (min-width: 720px) {
  .time-grid { grid-template-columns: repeat(6, 1fr); }
  .quote-grid { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 248px 1fr; }
  .rail {
    display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh;
    padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .rail .brand { padding: 4px 10px 18px; margin-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 1.02rem; }
  .rail button.tab {
    flex-direction: row; justify-content: flex-start; gap: 10px;
    font-size: 14.5px; min-height: 42px; border-radius: 10px; padding: 0 12px; white-space: nowrap;
  }
  .rail button.tab .ico { width: 18px; height: 18px; }
  .rail button.tab[aria-current="page"] { background: var(--accent-bg); }
  .rail button.tab .badge { position: static; margin-left: auto; }
  .tabbar { display: none; }
  .main { padding: 32px 40px 56px; }
  .section-label { display: block; }
  .fab { bottom: 24px; }
  .toast { bottom: 24px; }
  .trade-grid { grid-template-columns: 1fr 1fr 1fr; }
  .topbar { padding-left: 28px; padding-right: 28px; }
  .topbar .brand { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

</head>

  function managerJobs() {
    const groups = [
      ["needs", "Needs you"],
      ["awaiting", "Awaiting quotes"],
      ["progress", "In progress"],
      ["done", "Done"]
    ];
    let body = '<div class="stack"><h1>Jobs</h1>' + noticeNeeds(needsManagerCount(), "jobs");
    groups.forEach(g => {
      const items = state.jobs.filter(j => managerBucket(j) === g[0]);
      body += "<h2>" + g[1] + "</h2>";
      body += items.length ? items.map(jobCardManager).join("") : '<p class="muted">Nothing in this group.</p>';

  function calendarDots(role) {
    const dots = {};
    state.jobs.forEach(job => {
      const date = (job.awardedQuoteId && quoteById(job.awardedQuoteId) && quoteById(job.awardedQuoteId).date) || job.date;
      if (!date) return;
      if (role === "manager" && !job.owned) return;
      if (role === "contractor") {
        const mine = job.awardedTo === state.meId || quotesFor(job.id).some(q => q.contractorId === state.meId);
        if (!mine) return;
      }
      const booked = ["paid", "onsite", "review0", "fix1", "review1", "fix2", "released"].indexOf(job.stage) !== -1;
      const requested = job.stage === "open" || job.stage === "approved";
      const prev = dots[date] || { booked: false, requested: false };
      if (booked) prev.booked = true;
      if (requested) prev.requested = true;
      dots[date] = prev;
    });
    return dots;
  }

  function renderMonth(opts) {
    const year = opts.year, month = opts.month;
    const firstDow = new Date(year, month, 1).getDay();
    const lead = (firstDow + 6) % 7;
    const daysIn = new Date(year, month + 1, 0).getDate();
    let html = '<div class="between"><button class="icon-btn" type="button" data-act="' + opts.nav + '" data-dir="-1" aria-label="Previous month">Prev</button><strong>' + MONTHS[month] + " " + year + '</strong><button class="icon-btn" type="button" data-act="' + opts.nav + '" data-dir="1" aria-label="Next month">Next</button></div>';
    html += '<div class="cal">' + DOW_SHORT.map(d => '<div class="dow">' + d + "</div>").join("");
    for (let i = 0; i < lead; i++) html += "<div></div>";
    for (let d = 1; d <= daysIn; d++) {
      const iso = year + "-" + pad(month + 1) + "-" + pad(d);
      const dis = opts.disable ? opts.disable(iso) : "";
      const dots = (opts.dots && opts.dots[iso]) || {};
      const pressed = opts.selected === iso;
      const asked = opts.asked === iso;
      let label = fmtDateLong(iso);
      if (dis) label += ", " + dis;
      if (dots.booked) label += ", booked job";
      if (dots.requested) label += ", date waiting for a quote";
      if (pressed) label += ", selected";
      const dotHtml = '<span class="dots">' + (dots.booked ? '<span class="dot filled"></span>' : "") + (dots.requested ? '<span class="dot outlined"></span>' : "") + "</span>";
      html += '<button type="button" class="day' + (asked ? " asked" : "") + '" data-act="' + opts.pick + '" data-date="' + iso + '" aria-pressed="' + (pressed ? "true" : "false") + '" aria-disabled="' + (dis ? "true" : "false") + '" aria-label="' + esc(label) + '" data-reason="' + esc(dis) + '">' + d + dotHtml + "</button>";
    }
    html += "</div>";
    return html;
  }

  function calendarScreen() {
    const role = state.role;
    const dots = calendarDots(role);
    const selected = state.cal.selected;
    let panel = "";
    if (selected) {
      const items = state.jobs.filter(job => {
        const date = (quoteById(job.awardedQuoteId) || {}).date || job.date;
        if (date !== selected) return false;
        if (role === "manager") return job.owned;
        return job.awardedTo === state.meId || quotesFor(job.id).some(q => q.contractorId === state.meId);
      });
      const rows = items.map(job => {
        const q = quoteById(job.awardedQuoteId);
        const p = placeOf(job);
        let when = whenText(job);
        if (q) when = rangeText(q.date, q.time, q.duration, p.open, p.close);
        return '<button class="btn btn-secondary" type="button" data-act="open-job" data-id="' + job.id + '">' + esc(job.title) + " · " + esc(when) + "</button>";
      }).join("") || '<p class="muted">Nothing on this day.</p>';
      let book = "";
      if (role === "manager") {
        const closed = dayClosedForAll(selected);
        book = closed
          ? '<p role="alert">Contractors are not on site this day. Buildings are closed to contractors.</p>'
          : '<button class="btn btn-primary" type="button" data-act="book-day" data-date="' + selected + '">Book a job for this day</button>';
      }
      panel = '<div class="card stack"><h2>' + esc(fmtDateLong(selected)) + "</h2>" + rows + book + "</div>";
    }
    return '<div class="stack"><h1>Calendar</h1><p class="small muted">Filled dots are booked jobs. Outlined dots are dates still waiting for a quote.</p>' +
      renderMonth({ year: state.cal.year, month: state.cal.month, selected: selected, dots: dots, pick: "cal-day", nav: "cal-nav", disable: () => "" }) + panel + "</div>";
  }
  function dayClosedForAll(iso) {
    if (!isWeekend(iso)) return false;
    const usable = state.buildings.filter(b => inRadius(b.lat, b.lng));
    return usable.length > 0 && usable.every(b => !b.weekends);
  }

  function requestScreen() {
    const d = state.draft;
    if (!d) return "<p>Start a new request from Home.</p>";
    const titles = ["Building and place", "The issue", "Safety, access and site", "When and requirements", "Admin and review"];
    const bar = '<p class="small">Step ' + state.step + " of 5 · " + titles[state.step - 1] + '</p><div class="progress" aria-hidden="true"><span style="width:' + (state.step / 5 * 100) + '%"></span></div>';
    let body = "";
    if (state.step === 1) body = step1(d);
    if (state.step === 2) body = step2(d);
    if (state.step === 3) body = step3(d);
    if (state.step === 4) body = step4(d);
    if (state.step === 5) body = step5(d);
    const nextLabel = state.step === 5 ? "Post request" : "Continue";
    return '<div class="stack">' + bar + body +
      '<div class="row"><button class="btn btn-secondary auto" type="button" data-act="step-back">Back</button><button class="btn btn-primary" type="button" data-act="step-next" style="flex:1">' + nextLabel + "</button></div></div>";
  }
  function buildingChoices(d) {
    return state.buildings.map(b => '<option value="' + b.id + '"' + (b.id === d.buildingId ? " selected" : "") + ">" + esc(b.name) + "</option>").join("");
  }
  function step1(d) {
    const b = building(d.buildingId);
    let info = "";
    if (b) {
      const km = kmFromCbd(b.lat, b.lng);
      const outside = !inRadius(b.lat, b.lng);
      info = "<p>" + esc(b.streetNumber + " " + b.street + ", " + b.suburb + " VIC") + "</p><p class=\"small\">OC or plan " + esc(b.oc) + " · Approval limit " + moneyShort(b.limit) + " · " + kmText(km) + " from the CBD</p>";
      if (outside) info += '<div class="notice notice-bad" role="alert"><strong>We do not cover this area yet</strong><p>This building is ' + kmText(km) + " from Flinders Street Station.</p></div>";
    }
    return '<div class="card stack"><label class="field">Building<select data-field="draft.buildingId">' + buildingChoices(d) + "</select></label>" + info +
      field("Level, unit or area of the issue", "text", "draft.area", d.area, "Level 2, bin room") + "</div>";
  }
  function step2(d) {
    const chips = ALL_TRADES.map(t => '<button class="chip" type="button" data-act="draft-trade" data-trade="' + t.id + '" aria-pressed="' + (d.tradeId === t.id ? "true" : "false") + '">' + esc(t.name) + "</button>").join("");
    const t = tradeById(d.tradeId);
    const photos = mediaThumbs(d.photos, t.hue);
    const video = d.video ? mediaThumbs([d.video], t.hue) : "";
    return '<div class="card stack">' + field("Job title", "text", "draft.title", d.title) +
      '<span class="field">Trade or service</span><div class="row">' + chips + "</div>" +
      (d.tradeId === "other" ? field("Describe the trade", "text", "draft.otherTrade", d.otherTrade) : "") +
      '<p class="small">Licence: ' + esc(t.req) + "</p>" +
      areaField("Instructions for the contractor", "draft.instructions", d.instructions, 500) +
      '<p class="small">' + d.instructions.length + ' of 500</p><p class="small">Do not put access codes here. Everyone who opens this request can read it.</p>' +
      '<div class="between"><h3>Photos and video</h3><span class="demo">Demo</span></div>' +
      '<p class="small">Up to 10 photos and one video of up to 60 seconds. The camera is simulated.</p>' +
      '<div class="thumbs">' + photos + video + "</div>" +
      '<div class="row"><button class="btn btn-secondary auto" type="button" data-act="draft-photo"' + (d.photos.length >= 10 ? " disabled" : "") + '>Take a photo</button><button class="btn btn-secondary auto" type="button" data-act="draft-video"' + (d.video ? " disabled" : "") + ">Take a video</button></div></div>";
  }
  function mediaThumbs(items, hue) {
    return items.map(item => '<div class="thumb" style="--hue:' + (item.hue || hue || 168) + '"><span>' + (item.kind === "video" ? "Video" : "Photo") + "</span><span>" + esc(fmtStamp(item.at)) + (item.distanceM != null ? " · " + item.distanceM + " m" : "") + (item.seconds ? " · " + item.seconds + " seconds" : "") + "</span></div>").join("");
  }
  function yn(name, i, value) {
    return '<div class="row" role="group" aria-label="' + esc(name) + '"><button class="chip" type="button" data-act="safety" data-i="' + i + '" data-v="yes" aria-pressed="' + (value === "yes" ? "true" : "false") + '">Yes</button><button class="chip" type="button" data-act="safety" data-i="' + i + '" data-v="no" aria-pressed="' + (value === "no" ? "true" : "false") + '">No</button></div>';

  function managerJob(job) {

  function foundJobs() {
    const q = state.find.q.trim().toLowerCase();
    return openJobs().filter(job => {
      if (jobKm(job) > state.find.distance + 0.001) return false;
      if (state.find.trade !== "all" && job.tradeId !== state.find.trade) return false;
      if (!q) return true;
      const trade = tradeById(job.tradeId);
      const hay = (job.title + " " + placeOf(job).suburb + " " + placeOf(job).street + " " + trade.name + " " + (job.otherTrade || "")).toLowerCase();
      if (hay.indexOf(q) !== -1) return true;
      const words = q.split(/\s+/);
      return words.some(w => ALL_TRADES.some(t => t.words.indexOf(w) !== -1 && t.id === job.tradeId));
    });
  }
  function sortFound(list) {
    const cmp = state.find.sort === "closest" ? (a, b) => jobKm(a) - jobKm(b) : (a, b) => b.postedAt - a.postedAt;
    const em = list.filter(isEmergency).sort(cmp);
    const rest = list.filter(j => !isEmergency(j)).sort(cmp);
    return em.concat(rest);
  }

  function findJobs() {

  function project(lat, lng) {
    const dx = (lng - CBD.lng) * 111 * Math.cos(CBD.lat * Math.PI / 180);
    const dy = (lat - CBD.lat) * 111;
    const scale = 150 / Math.max(8, state.owner.radiusKm);
    return { x: 180 + dx * scale, y: 200 - dy * scale };
  }
  function layoutPins(pins) {
    const placed = [];
    pins.forEach(p => {
      let x = p.x, y = p.y, tries = 0;
      while (placed.some(q => Math.hypot(q.x - x, q.y - y) < 28) && tries < 24) {
        const ang = tries * 1.35;
        const rad = 18 + tries * 3;
        x = p.x + Math.cos(ang) * rad;
        y = p.y + Math.sin(ang) * rad;
        tries += 1;
      }
      placed.push(Object.assign({}, p, { x: x, y: y }));
    });
    return placed;
  }
  function mapHtml(list) {
    const pins = list.map(job => {
      const p = placeOf(job);
      const pt = project(p.lat, p.lng);
      return { job: job, x: pt.x, y: pt.y, booked: false };
    });
    if (state.find.showBooked) {
      state.jobs.forEach(job => {
        if (job.awardedTo !== state.meId) return;
        if (["paid", "onsite", "fix1", "fix2", "review0", "review1"].indexOf(job.stage) === -1) return;
        const p = placeOf(job);
        const pt = project(p.lat, p.lng);
        pins.push({ job: job, x: pt.x, y: pt.y, booked: true });
      });
    }
    const laid = layoutPins(pins);
    const rings = [2, 5, 8].map(km => {
      const r = (150 / Math.max(8, state.owner.radiusKm)) * km;
      return '<circle cx="180" cy="200" r="' + r + '" fill="none" stroke="var(--brand)" stroke-opacity="0.45"/>' +
        '<text x="' + (180 + r + 2) + '" y="196" font-size="10" fill="var(--muted)">' + km + " km</text>";
    }).join("");
    const coverR = (150 / Math.max(8, state.owner.radiusKm)) * state.owner.radiusKm;
    const svg = '<svg viewBox="0 0 360 400" role="img" aria-label="Illustrative map of open jobs around the Melbourne CBD">' +
      '<rect width="360" height="400" fill="var(--map)"/>' +
      [40, 80, 120, 160, 200, 240, 280, 320].map(v => '<line x1="' + v + '" y1="0" x2="' + v + '" y2="400" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="' + v + '" x2="360" y2="' + v + '" stroke="var(--grid)" stroke-width="1"/>').join("") +
      '<path d="M0 250 C 70 230, 120 270, 180 246 S 280 220, 360 250" fill="none" stroke="var(--river)" stroke-width="14" stroke-linecap="round"/>' +
      rings +
      '<circle cx="180" cy="200" r="' + coverR + '" fill="none" stroke="var(--brand)" stroke-dasharray="4 4"/>' +
      '<rect x="174" y="194" width="12" height="12" transform="rotate(45 180 200)" fill="var(--brand)"/>' +
      '<text x="188" y="188" font-size="11" fill="var(--ink)">CBD</text></svg>';
    const buttons = laid.map(p => {
      const t = tradeById(p.job.tradeId);
      const place = placeOf(p.job);
      const label = t.name + " job, approximate area near " + place.suburb + (p.booked ? ", your booked job" : "") + (isEmergency(p.job) ? ", emergency" : "");
      return '<button class="pin' + (isEmergency(p.job) ? " emergency" : "") + (p.booked ? " booked" : "") + '" type="button" style="left:' + (p.x / 360 * 100) + '%;top:' + (p.y / 400 * 100) + '%;--hue:' + t.hue + '" data-act="pin" data-id="' + p.job.id + '" aria-label="' + esc(label) + '"><span class="mini">' + icon(t.id) + "</span></button>";
    }).join("");
    let preview = "";
    if (state.find.previewId) {
      const job = jobById(state.find.previewId);
      if (job) preview = contractorCard(job);
    }
    return '<div class="stack"><div class="map-stage">' + svg + buttons + '</div><p class="small">This is an illustrative map. The real app uses a live map. Pins show approximate areas only.</p>' +
      '<button class="chip" type="button" data-act="show-booked" aria-pressed="' + (state.find.showBooked ? "true" : "false") + '">Show my booked jobs</button>' + preview + "</div>";
  }

  function ensureOffer(job) {
    if (state.offer && state.offer.jobId === job.id) return;

  }
  function blockReason(job) {
    const c = me();
    if (!offersTrade(c, job.tradeId)) return "This job is outside your licence, so you cannot make an offer.";
    if (insuranceExpired(c)) return "Your public liability insurance has expired, so you cannot make an offer.";
    if (c.cover < job.insurance) return "Your insurance cover is $" + c.cover + " million. This job asks for $" + job.insurance + " million, so you cannot make an offer.";
    if (!c.consentPublic) return "Agree on your profile that managers can see your verification, description and years before you make an offer.";

  }
  function contractorJob(job) {
    const p = placeOf(job);

      top += "<h2>" + esc(p.buildingName) + "</h2><p>" + esc(addressFull(job)) + "</p><p>" + esc(job.area) + "</p><p>" + kmText(jobKm(job)) + " from the CBD</p>";
    } else {
      top += "<h2>" + esc(streetPublic(job)) + "</h2><p>" + esc(job.area) + "</p><p>" + kmText(jobKm(job)) + " from the CBD</p>";
    }
    top += "<p>Parking: " + esc(job.parking) + (job.parkingNote ? " · " + esc(job.parkingNote) : "") + "</p>";
    top += '<div class="thumbs">' + mediaThumbs(job.photos || [], tradeById(job.tradeId).hue) + (job.video ? mediaThumbs([job.video], tradeById(job.tradeId).hue) : "") + "</div>";
    top += "<h3>Instructions</h3><p>" + esc(job.instructions || "None") + "</p>" + safetyBlock(job);

    if (awarded && (job.stage === "review0" || job.stage === "review1")) work = '<div class="card"><h2>Waiting for the manager</h2><p>They have 48 hours to accept or challenge.</p></div>';
    if (awarded && job.stage === "released") work = releasedContractor(job);

    return '<div class="stack">' + top + work + '<button class="btn btn-secondary" type="button" data-act="open-evidence" data-id="' + job.id + '">View evidence record</button><div class="card">' + timelineHtml(job) + "</div></div>";
  }
  function requirementLines(job) {

    const note = (NOTICES.find(n => n.id === job.notice) || {}).label || "";

  function offerBlock(job) {
    const sent = state.quotes.find(q => q.jobId === job.id && q.contractorId === state.meId);
    if (sent) {
      return '<div class="card stack"><h2>Offer sent</h2><p>' + money(sent.price) + " · " + esc(rangeText(sent.date, sent.time, sent.duration, placeOf(job).open, placeOf(job).close)) + "</p><ul class=\"clean\">" + sent.scope.map(s => "<li>" + esc(s) + "</li>").join("") + "</ul></div>";

    const durs = isEmergency(job) ? '<h3>How long</h3><div class="row">' + DURATIONS.map(d => '<button class="chip" type="button" data-act="offer-duration" data-dur="' + d.id + '" aria-pressed="' + (o.duration === d.id ? "true" : "false") + '">' + esc(d.label) + "</button>").join("") + "</div>" : "";
    return btn + '<form id="offer-form" class="card stack" onsubmit="return false"><h2>Make an offer</h2>' +
      '<div class="summary-card"><h3>Your start</h3><p>' + summary + "</p></div>" +
      field("Total price", "number", "offer.price", o.price, "0") +
      "<p>" + gst + "</p><p>" + preview + "</p>" + when + durs + clash +
      areaField("What is included (one item per line)", "offer.scope", o.scope) +
      areaField("Note (optional)", "offer.note", o.note) +
      "<p>Warranties and insurance are agreed between the manager and the contractor.</p>" +
      '<button class="btn btn-primary" type="button" data-act="send-offer" data-id="' + job.id + '">Send my offer</button></form>';

  function offerSummary(job, o) {

  function gettingThere(job) {

  function applyField(field, value) {
    if (field === "find.q") { state.find.q = value; return false; }
    if (field.indexOf("manager.") === 0) {
      const key = field.split(".")[1];
      state.manager[key] = key === "consent" ? !!value : value;
      return true;
    }
    if (field.indexOf("building.") === 0) {
      const [, id, key] = field.split(".");
      const b = building(id); if (!b) return false;
      if (key === "weekends") b.weekends = !!value;
      else if (key === "limit" || key === "captureM") b[key] = Number(value);
      else b[key] = value;
      return true;
    }
    if (field.indexOf("owner.") === 0) {
      const key = field.split(".")[1];
      if (key === "gstOnFee") state.owner.gstOnFee = !!value;
      else state.owner[key] = Number(value);
      if (state.owner.radiusKm < 1) state.owner.radiusKm = 1;
      if (state.owner.feePercent < 0) state.owner.feePercent = 0;
      return true;
    }
    if (field.indexOf("draft.") === 0) {
      const key = field.split(".")[1];
      if (!state.draft) return false;
      if (key === "flexible" || key === "swms") state.draft[key] = !!value;
      else state.draft[key] = value;
      if (key === "buildingId") {
        const b = building(value);
        if (b) { state.draft.access = b.access; state.draft.invoiceTo = b.oc; state.draft.invoiceAbn = b.ocAbn; }
      }
      if (key === "instructions" && state.draft.instructions.length > 500) state.draft.instructions = state.draft.instructions.slice(0, 500);
      return true;
    }
    if (field.indexOf("new.") === 0) {
      state.newBuilding[field.split(".")[1]] = value;
      return true;
    }
    if (field.indexOf("offer.") === 0) {
      if (state.offer) state.offer[field.split(".")[1]] = value;
      return true;
    }
    if (field.indexOf("me.") === 0) {
      const c = me();
      const key = field.split(".")[1];
      if (key === "description") c.description = value;
      if (key === "years") c.years = Number(value) || 0;
      if (key === "consent") c.consentPublic = !!value;
      if (key === "expired") state.insExpiredDemo = !!value;
      return true;
    }
    if (field.indexOf("em.") === 0) {
      state.emergency[field.split(".")[1]] = value;
      return true;
    }
    if (field === "approve.consent") { state.approveConsent = !!value; return true; }
    if (field.indexOf("challenge.") === 0) {
      if (field === "challenge.note") state.challengeNote = value;
      else {
        state.challengePicks = state.challengePicks || {};
        state.challengePicks[field.split(".")[1]] = !!value;
      }
      return true;
    }
    if (field === "job.far") {
      const job = jobById(state.ctx.id);
      if (job) { job.farDemo = !!value; if (!value) job.farMessage = ""; }
      return true;
    }
    return true;
  }

  function onClick(e) {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    if (t.getAttribute("aria-disabled") === "true" || t.disabled) return;
    const act = t.dataset.act;
    const keep = ["distance", "find-trade", "sort", "find-view", "toggle-filters", "show-booked", "people-trade", "pin"].indexOf(act) !== -1;
    if (act === "tab") {
      if (t.dataset.screen === "find" && state.screen === "home" && state.role === "contractor") { /* keep */ }
      goTab(t.dataset.screen);
      return;
    }
    if (act === "role") {
      state.role = t.dataset.role;
      state.history = [];
      state.screen = "home";
      state.ctx = {};
      state.title = "";
      render();
      return;
    }
    if (act === "theme") {
      state.themeChoice = state.themeChoice === "auto" ? "light" : state.themeChoice === "light" ? "dark" : "auto";
      saveTheme();
      render({ keepScroll: true });
      return;
    }
    if (act === "back") { back(); return; }
    if (act === "new-request") { startRequest({ tradeId: t.dataset.trade || "plumbing" }); return; }
    if (act === "owner") { push("owner", {}, "Owner settings"); return; }
    if (act === "add-building") {
      state.newBuilding = { name: "", number: "", street: "", suburb: "Balwyn", oc: "", limit: 4999 };
      push("building-new", {}, "Add a building");
      return;
    }
    if (act === "save-building") return saveBuilding(false);
    if (act === "join-wait") return saveBuilding(true);
    if (act === "set-manager-role") { state.manager.role = t.dataset.value; render({ keepScroll: true }); return; }
    if (act === "set-manager-pay") { state.manager.payment = t.dataset.value; render({ keepScroll: true }); return; }
    if (act === "people-trade") { state.peopleTrade = t.dataset.trade; render({ keepScroll: true }); return; }
    if (act === "open-person") { push("person", { id: t.dataset.id }, "Contractor"); return; }
    if (act === "open-job" || act === "card-action") {
      const job = jobById(t.dataset.id);
      if (!job) return;
      if (act === "card-action" && offerState(job) === "outside") return;
      push("job", { id: job.id }, job.title);
      if (act === "card-action" && offerState(job) === "offer") render({ scrollOffer: true });
      return;
    }
    if (act === "open-evidence") { push("evidence", { id: t.dataset.id }, "Evidence"); return; }
    if (act === "open-pay") { state.payMethod = ""; push("pay", { id: t.dataset.id }, "Pay to start"); return; }
    if (act === "open-guide") { push("guide", {}, "Safety guide"); return; }
    if (act === "emergency") {
      const fromJob = state.role === "contractor" && state.screen === "job" ? state.ctx.id : "";
      state.emergency = null;
      push("emergency", { fromJob: fromJob }, "Emergency");
      return;
    }
    if (act === "step-back") {
      if (state.step === 1) back();
      else { state.step -= 1; render(); }
      return;
    }
    if (act === "step-next") {
      const err = validateStep(state.draft);
      if (err) { toast(err); return; }
      if (state.step < 5) { state.step += 1; render(); }
      else postDraft();
      return;
    }
    if (act === "draft-trade") { state.draft.tradeId = t.dataset.trade; if (state.draft.safety[4] === "yes") state.draft.swms = true; render({ keepScroll: true }); return; }
    if (act === "draft-photo") return addDraftMedia("photo");
    if (act === "draft-video") return addDraftMedia("video");
    if (act === "safety") {
      const i = Number(t.dataset.i);
      state.draft.safety[i] = t.dataset.v;
      if (i === 0 && t.dataset.v === "yes") state.draft.urgency = "emergency";
      if (i === 4 && t.dataset.v === "yes") state.draft.swms = true;
      render({ keepScroll: true });
      return;
    }
    if (act === "make-emergency") { state.draft.urgency = "emergency"; toast("This request is now an emergency."); render({ keepScroll: true }); return; }
    if (act === "parking") { state.draft.parking = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "lift") { state.draft.lift = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "urgency") { state.draft.urgency = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "time-mode") { state.draft.timeMode = t.dataset.v; state.draft.exactTime = ""; render({ keepScroll: true }); return; }
    if (act === "exact-time") { state.draft.timeMode = "exact"; state.draft.exactTime = t.dataset.time; render({ keepScroll: true }); return; }
    if (act === "deadline") { state.draft.deadline = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "materials") { state.draft.materials = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "insurance") { state.draft.insurance = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "notice") { state.draft.notice = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "draft-date") {
      if (t.getAttribute("aria-disabled") === "true") return;
      state.draft.date = t.dataset.date;
      render({ keepScroll: true });
      return;
    }
    if (act === "cal-nav" || act === "offer-nav") return shiftMonth(act === "offer-nav" ? state.offerCal : state.cal, Number(t.dataset.dir));
    if (act === "cal-day") { state.cal.selected = t.dataset.date; render({ keepScroll: true }); return; }
    if (act === "book-day") { startRequest({ date: t.dataset.date }); return; }
    if (act === "search") { state.screen = "find"; state.role = "contractor"; state.history = []; state.title = ""; render(); return; }
    if (act === "see-map") { state.find.view = "map"; goTab("find"); return; }
    if (act === "find-trade") {
      const already = state.screen === "find";
      state.find.trade = t.dataset.trade;
      if (!already) { state.screen = "find"; state.history = []; state.title = ""; }
      render({ keepScroll: already && keep });
      return;
    }
    if (act === "distance") { state.find.distance = Number(t.dataset.v); render({ keepScroll: true }); return; }
    if (act === "sort") { state.find.sort = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "find-view") { state.find.view = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "toggle-filters") { state.find.filtersOpen = !state.find.filtersOpen; render({ keepScroll: true }); return; }
    if (act === "show-booked") { state.find.showBooked = !state.find.showBooked; render({ keepScroll: true }); return; }
    if (act === "pin") { state.find.previewId = t.dataset.id; render({ keepScroll: true }); return; }
    if (act === "scroll-offer") { const el = document.getElementById("offer-form"); if (el) el.scrollIntoView({ block: "start" }); return; }
    if (act === "offer-date") {
      if (t.getAttribute("aria-disabled") === "true") return;
      state.offer.date = t.dataset.date;
      render({ keepScroll: true });
      return;
    }
    if (act === "offer-duration") { state.offer.duration = t.dataset.dur; state.offer.time = ""; render({ keepScroll: true }); return; }
    if (act === "offer-time") { state.offer.time = t.dataset.time; render({ keepScroll: true }); return; }
    if (act === "eta-arrive") { state.offer.eta = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "send-offer") return sendOffer(t.dataset.id);
    if (act === "approve") { state.approveConsent = false; push("approve", { quoteId: t.dataset.id }, "Approve quote"); return; }
    if (act === "committee") {
      const q = quoteById(t.dataset.id); if (!q) return;
      q.committeeApproved = true;
      toast("Committee approval recorded (demo).");
      render({ keepScroll: true });
      return;
    }
    if (act === "approve-continue") return doApprove(t.dataset.id);
    if (act === "pay-method") { state.payMethod = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "pay-hold") return doPay(t.dataset.id);
    if (act === "release-slot") return doReleaseSlot(t.dataset.id);
    if (act === "confirm-arrival") return mutateJob(t.dataset.id, job => { job.arrivalConfirmed = true; log(job, "Manager confirmed the arrival."); toast("Arrival confirmed."); });
    if (act === "let-in") return mutateJob(t.dataset.id, job => { job.arrival = "arrived"; job.arrivalAt = Date.now(); log(job, "Manager let the contractor in."); toast("They can start the safety check."); });
    if (act === "seen-alert") return mutateJob(t.dataset.id, job => { job.alertSeen = true; log(job, "Manager has seen the emergency alert."); });
    if (act === "accept" || act === "skip-48") return mutateJob(t.dataset.id, job => release(job, act === "skip-48" ? "The 48 hours ended with no response, so the work was accepted. The money has been released." : "The manager accepted the work. The money has been released."));
    if (act === "challenge") return doChallenge(t.dataset.id);
    if (act === "on-way") return mutateJob(t.dataset.id, job => { job.arrival = "on_way"; job.eta = Number(t.dataset.v); log(job, "On the way, about " + job.eta + " minutes."); });
    if (act === "late") return mutateJob(t.dataset.id, job => {
      const add = Number(t.dataset.v);
      job.eta = (job.eta || 0) + add;
      job.arrival = "late";
      log(job, "Running late, about " + job.eta + " minutes.");
    });
    if (act === "arrived") return markArrived(t.dataset.id);
    if (act === "cannot") return mutateJob(t.dataset.id, job => { job.arrival = "cannot_get_in"; log(job, "Contractor cannot get in."); toast("The manager has been told."); });
    if (act === "onsite") {
      const job = jobById(state.ctx.id); if (!job) return;
      job.safetyOnSite[Number(t.dataset.i)] = t.dataset.v;
      render({ keepScroll: true });
      return;
    }
    if (act === "start-work") return mutateJob(t.dataset.id, job => {
      const c = me();
      if (!(job.arrival === "arrived" || job.letIn) || !job.safetyOnSite.every(v => v === "yes") || !c.guideDone) { toast("Arrive, answer yes to every safety question, and finish the safety guide first."); return; }
      job.stage = "onsite";
      log(job, "Work started. On-site safety answers saved.");
    });
    if (act === "stop-unsafe") return mutateJob(t.dataset.id, job => {
      job.stage = "paid";
      job.safetyOnSite = [null, null, null, null, null];
      log(job, "Stopped as unsafe. Safety answers cleared. No penalty.");
      toast("Work stopped. The job is booked again.");
      if (state.screen === "emergency") back();
    });
    if (act === "take-photo" || act === "take-video") return takeEvidence(t.dataset.id, t.dataset.stage, act === "take-photo" ? "photo" : "video");
    if (act === "submit-work") return submitWork(t.dataset.id);
    if (act === "toggle-trade") return toggleTrade(t.dataset.trade);
    if (act === "guide-done") { me().guideDone = true; toast("Safety guide done."); back(); return; }
    if (act === "export") { exportRecord(jobById(t.dataset.id)); render({ keepScroll: true }); return; }
    if (act === "em-kind") { state.emergency.kind = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "em-trade") { state.emergency.trade = t.dataset.trade; render({ keepScroll: true }); return; }
    if (act === "em-danger") { state.emergency.danger = t.dataset.v; render({ keepScroll: true }); return; }
    if (act === "em-photo") {
      if (state.emergency.photos.length >= 10) return;
      state.emergency.photos.push({ id: uid("ph"), kind: "photo", at: Date.now(), distanceM: null, hue: 8 });
      render({ keepScroll: true });
      return;
    }
    if (act === "send-emergency") return sendEmergency();
    if (act === "alert-support") return mutateJob(t.dataset.id, job => {
      job.contractorAlert = true;
      job.alertSeen = false;
      log(job, "Contractor alerted the site contact and Strata App support.");
      toast("The manager and Strata App support have been alerted (demo).");
    });
  }

  function shiftMonth(cal, dir) {
    cal.month += dir;
    if (cal.month < 0) { cal.month = 11; cal.year -= 1; }
    if (cal.month > 11) { cal.month = 0; cal.year += 1; }
    render({ keepScroll: true });
  }
  function addDraftMedia(kind) {
    const d = state.draft;
    if (kind === "photo" && d.photos.length >= 10) return;
    if (kind === "video" && d.video) return;
    const item = { id: uid("ph"), kind: kind, at: Date.now(), distanceM: null, seconds: kind === "video" ? 12 : 0, hue: tradeById(d.tradeId).hue };
    if (kind === "photo") d.photos.push(item); else d.video = item;
    render({ keepScroll: true });
  }
  function saveBuilding(waiting) {
    const n = state.newBuilding;
    if (!n.name.trim() || !n.street.trim() || !n.number.trim() || !n.oc.trim()) { toast("Add the name, address and OC or plan number."); return; }
    const s = suburbByName(n.suburb);
    const rec = { id: uid("b"), name: n.name.trim(), streetNumber: n.number.trim(), street: n.street.trim(), suburb: s.name, lat: s.lat, lng: s.lng, oc: n.oc.trim(), ocAbn: "", limit: Number(n.limit) || 4999, open: "08:00", close: "17:00", weekends: false, access: "", captureM: 150, sample: false };
    if (!inRadius(s.lat, s.lng)) {
      if (!waiting) { render({ keepScroll: true }); return; }
      state.waiting.push(rec);
      toast("Saved to the waiting list.");
      state.history = [];
      state.screen = "buildings";
      state.title = "";
      render();
      return;
    }
    state.buildings.push(rec);
    toast("Building saved.");
    state.history = [];
    state.screen = "buildings";
    state.title = "";
    render();
  }
  function sendOffer(jobId) {
    const job = jobById(jobId);
    const o = state.offer;
    const reason = blockReason(job);
    if (reason) { toast(reason); return; }
    const price = Number(o.price);
    if (!price || price <= 0) { toast("Add a total price."); return; }
    const scope = o.scope.split(/\n/).map(s => s.trim()).filter(Boolean);
    if (!scope.length) { toast("Add what is included, one item per line."); return; }
    let date, time, duration;
    if (isEmergency(job)) {
      if (!o.eta) { toast("Choose when you can be there."); return; }
      if (!o.duration) { toast("Choose how long the job will take."); return; }
      const arrival = new Date(Date.now() + Number(o.eta) * 60000);
      date = fmtISO(arrival);
      time = pad(arrival.getHours()) + ":" + pad(arrival.getMinutes() < 30 ? 0 : 30);
      duration = o.duration;
    } else {
      if (!o.date || !o.duration || !o.time) { toast("Choose a date, how long, and a start time."); return; }
      date = o.date; time = o.time; duration = o.duration;
    }
    const quote = { id: uid("q"), jobId: job.id, contractorId: state.meId, price: price, date: date, time: time, duration: duration, scope: scope, note: o.note.trim(), at: Date.now(), committeeApproved: false };
    state.quotes.push(quote);
    log(job, "Offer sent by " + me().name + " for " + money(price) + ".");
    toast("Offer sent.");
    render();
  }
  function doApprove(quoteId) {
    const q = quoteById(quoteId);
    const job = jobById(q.jobId);
    const p = placeOf(job);
    if (q.price > p.limit && !q.committeeApproved) { toast("Needs committee approval."); return; }
    if (!state.approveConsent) { toast("Tick the consent to continue."); return; }
    job.stage = "approved";
    job.awardedQuoteId = q.id;
    job.awardedTo = q.contractorId;
    log(job, "Quote from " + person(q.contractorId).name + " approved for " + money(q.price) + ".");
    state.payMethod = state.manager.payment || "";
    state.history = [];
    state.screen = "pay";
    state.ctx = { id: job.id };
    state.title = "Pay to start";
    toast("Quote approved. Pay to hold the money.");
    render();
  }
  function doPay(jobId) {
    const job = jobById(jobId);
    if (!state.payMethod) { toast("Choose bank transfer or card."); return; }
    job.stage = "paid";
    job.payMethod = state.payMethod;
    job.paidAt = Date.now();
    log(job, "Payment held (" + (state.payMethod === "card" ? "card" : "bank transfer") + "). The job can start.");
    toast("Payment held (demo). The job can start.");
    state.history = [];
    state.screen = "job";
    state.ctx = { id: job.id };
    state.title = job.title;
    render();
  }
  function doReleaseSlot(jobId) {
    const job = jobById(jobId);
    job.stage = "open";
    job.awardedQuoteId = null;
    job.awardedTo = null;
    log(job, "Unpaid slot released (demo).");
    toast("The time slot has been released (demo).");
    state.history = [];
    state.screen = "job";
    state.ctx = { id: job.id };
    state.title = job.title;
    render();
  }
  function mutateJob(id, fn) {
    const job = jobById(id);
    if (!job) return;
    fn(job);
    render({ keepScroll: true });
  }
  function markArrived(id) {
    const job = jobById(id);
    if (job.farDemo) {
      job.farMessage = "You are 640 m from the building. Move closer and retake it.";
      render({ keepScroll: true });
      return;
    }
    const p = placeOf(job);
    job.farMessage = "";
    job.arrival = "arrived";
    job.arrivalAt = Date.now();
    job.arrivalDistance = Math.min(20, Math.max(1, p.captureM - 1));
    log(job, "Arrived, " + job.arrivalDistance + " m from the building at " + fmtClock(job.arrivalAt) + ".");
    toast("Arrival recorded. The site contact has been told (demo).");
    render({ keepScroll: true });
  }
  function takeEvidence(id, stage, kind) {
    const job = jobById(id);
    const items = job.evidence[stage] || (job.evidence[stage] = []);
    if (kind === "photo" && items.filter(i => i.kind === "photo").length >= 10) { toast("You can add up to 10 photos for this stage."); return; }
    if (kind === "video" && items.some(i => i.kind === "video")) { toast("You can add one video for this stage."); return; }
    const item = captureItem(job, kind);
    if (!item) { render({ keepScroll: true }); return; }
    items.push(item);
    log(job, (kind === "photo" ? "Photo" : "Video") + " added (" + stage + "), " + item.distanceM + " m from the building.");
    render({ keepScroll: true });
  }
  function submitWork(id) {
    const job = jobById(id);
    if (!canSubmit(job)) { toast("Add the photos and video this stage needs."); return; }
    if (job.stage === "onsite") {
      job.stage = "review0";
      job.reviewStartedAt = Date.now();
      log(job, "Work submitted for review. The manager has 48 hours.");
      toast("Submitted. The manager has 48 hours.");
    } else if (job.stage === "fix1") {
      job.stage = "review1";
      job.reviewStartedAt = Date.now();
      log(job, "Fix submitted. The manager has another 48 hours.");
      toast("Fix submitted.");
    } else if (job.stage === "fix2") {
      release(job, "The final fix was submitted and the evidence is complete. The money has been released.");
      toast("Final fix submitted. The money has been released.");
    }
    render({ keepScroll: true });
  }
  function doChallenge(id) {
    const job = jobById(id);
    const q = quoteById(job.awardedQuoteId);
    const picks = [];
    (q.scope || []).forEach((item, i) => { if (state.challengePicks && state.challengePicks[i]) picks.push(item); });
    if (!picks.length) { toast("Choose at least one item to challenge."); return; }
    const round = job.challenges.length + 1;
    job.challenges.push({ round: round, items: picks, note: (state.challengeNote || "").trim(), at: Date.now() });
    state.challengePicks = {};
    state.challengeNote = "";
    if (job.stage === "review0") {
      job.stage = "fix1";
      log(job, "Manager challenged: " + picks.join(", ") + ".");
      toast("Fix requested.");
    } else {
      job.stage = "fix2";
      log(job, "Manager challenged again: " + picks.join(", ") + ". This is the final fix.");
      toast("Final fix requested.");
    }
    render();
  }
  function toggleTrade(id) {
    const c = me();
    const i = c.trades.indexOf(id);
    if (i === -1) c.trades.push(id);
    else {
      if (c.trades.length === 1) { toast("Choose at least one trade."); return; }
      c.trades.splice(i, 1);
    }
    render({ keepScroll: true });
  }
  function sendEmergency() {
    const e = state.emergency;
    if (!e.buildingId || !e.kind || !e.where.trim() || !e.danger || !e.phone.trim()) { toast("Add the building, what is wrong, where, whether anyone is in danger, and a phone number."); return; }
    if (e.kind === "other" && !e.trade) { toast("Choose a trade for this emergency."); return; }
    const kind = EMERGENCY_KINDS.find(k => k.id === e.kind);
    const b = building(e.buildingId);
    if (!inRadius(b.lat, b.lng)) { toast("We do not cover this area yet."); return; }
    const job = {
      id: uid("job"), owned: true, sample: false, buildingId: b.id, area: e.where.trim(),
      title: kind.label === "Something else" ? "Emergency: " + tradeById(e.trade).name : kind.label,
      tradeId: kind.trade || e.trade, otherTrade: "", instructions: e.description.trim(),
      photos: e.photos, video: null,
      safety: [e.danger === "yes" ? "yes" : "no", "yes", "no", "no", "no", "no", "no"],
      safetyNote: "", parking: "Yes", parkingNote: "", siteRules: "",
      urgency: "emergency", date: todayISO(), timeMode: "anytime", exactTime: "", flexible: false, deadline: "today",
      materials: "contractor", insurance: 20, swms: false, notice: "will", lift: "none",
      reference: "", approver: state.manager.name || "Manager", invoiceTo: b.oc, invoiceAbn: b.ocAbn,
      access: b.access, phone: e.phone.trim(), postedAt: Date.now(), stage: "open",
      arrival: null, eta: null, arrivalAt: null, arrivalDistance: null, arrivalConfirmed: false,
      safetyOnSite: [null, null, null, null, null], contractorAlert: false, alertSeen: false,
      awardedQuoteId: null, awardedTo: null, paidAt: null, payMethod: null, challenges: [],
      evidence: { before: [], after: [], fix1: [], fix2: [] }, timeline: [], releasedAt: null, reviewStartedAt: null, farDemo: false
    };
    log(job, "Emergency request sent. Contractors were alerted (demo).");
    state.jobs.unshift(job);
    toast("Emergency sent. Contractors were alerted (demo).");
    state.history = [];
    state.screen = "job";
    state.ctx = { id: job.id };
    state.title = job.title;
    render();
  }

  document.addEventListener("click", onClick);
  document.addEventListener("input", e => {
    const el = e.target;
    if (!el.dataset || !el.dataset.field) return;
    const rerender = applyField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value);
    if (rerender) render({ keepScroll: true, keepFocus: true });
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (!el.dataset || !el.dataset.field) return;
    if (el.type !== "checkbox" && el.tagName !== "SELECT") return;
    applyField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value);
    render({ keepScroll: true, keepFocus: true });
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.field === "find.q") {
      e.preventDefault();
      state.role = "contractor";
      state.screen = "find";
      state.history = [];
      render();
    }
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (state.themeChoice === "auto") applyTheme();
  });

  loadTheme();
  seed();
  applyTheme();
  render();

  window.__strata = {
    state: state,
    haversine: haversine,
    kmFromCbd: kmFromCbd,
    profileComplete: profileComplete,
    money: money,
    receives: receives,
    feeFor: feeFor
  };
})();
</script>
</body>
</html>
