<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#15201C; --muted:#5B6863; --line:#D9E1DD;
  --brand:#0E5A4B; --on-brand:#FFFFFF; --gold:#FFC93C; --on-gold:#1B1600;
  --ok-bg:#DDF3E6; --ok-ink:#0B5B36; --warn-bg:#FFF0C7; --warn-ink:#6B4B00; --bad-bg:#FCE1DB; --bad-ink:#9A2A14;
  --tint-s:80%; --tint-l:91%;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B120F; --surface:#141F1A; --ink:#EAF2EE; --muted:#9DAEA6; --line:#25342D;
    --brand:#5FD3B6; --on-brand:#06231B;
    --ok-bg:#12382A; --ok-ink:#8BE3B4; --warn-bg:#3B2F0C; --warn-ink:#F5D57A; --bad-bg:#3D1A13; --bad-ink:#FFB4A3;
    --tint-s:32%; --tint-l:22%;
  }
}
:root[data-theme="dark"]{
  --bg:#0B120F; --surface:#141F1A; --ink:#EAF2EE; --muted:#9DAEA6; --line:#25342D;
  --brand:#5FD3B6; --on-brand:#06231B;
  --ok-bg:#12382A; --ok-ink:#8BE3B4; --warn-bg:#3B2F0C; --warn-ink:#F5D57A; --bad-bg:#3D1A13; --bad-ink:#FFB4A3;
  --tint-s:32%; --tint-l:22%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:left}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto;background:var(--bg)}
.main{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;flex:none;width:100%;max-width:880px;margin:0 auto}
.bsec-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 0;color:inherit;font:inherit;cursor:pointer}
.bsec{border-top:1px solid var(--line)}
.bsec .sbody{display:none;padding:0 0 12px}.bsec.open>.sbody{display:block}
.bcard .bbody{display:none;margin-top:4px}.bcard.open>.bbody{display:block}
.chev{font-size:24px;line-height:1;color:var(--muted);transition:transform .15s}.bsec.open>.bsec-h .chev,.bcard.open>.bsec-h .chev{transform:rotate(90deg)}
.msg{background:var(--chip,rgba(127,127,127,.12));border-radius:12px;padding:8px 12px;margin:6px 0}.msg.me{margin-left:22px;background:var(--ok-bg)}.msg p{margin:2px 0 0;white-space:pre-wrap}
.rsec{margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line);font-size:1.05rem}.rsub{font-weight:700;margin:12px 0 4px}.nw{white-space:nowrap;margin-left:10px}
.seg select.rolesel{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-weight:600;color:inherit;padding:8px 22px 8px 14px;border-radius:999px;max-width:150px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}.seg select.rolesel.on{background-color:var(--brand);color:#fff}
.top:has(.seg){flex-wrap:wrap}.top:has(.seg) .seg{order:3;flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr;align-items:stretch}.top:has(.seg) .seg>*{box-sizing:border-box;width:100%}.top:has(.seg) .seg select.rolesel{flex:1 1 0;max-width:none;min-width:0;font-size:13.5px;text-align:left}.top:has(.seg) .seg>button{flex:1 1 0;min-width:0;padding:7px 16px;text-align:center}
.qrsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.qrlab{border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center;background:#fff;color:#111;break-inside:avoid}.qrlab svg{max-width:100%;height:auto}
.logo{width:30px;height:30px;border-radius:9px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;flex:none}
.wordmark{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.wordmark small{display:block;font-family:'Figtree',system-ui,sans-serif;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:0;margin:2px 0 0;text-transform:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.ttl{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;flex:1;min-width:0}
#view{flex:1;overflow-y:auto;padding:8px 16px 64px;width:100%;max-width:880px;margin:0 auto;-webkit-overflow-scrolling:touch}
.display{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.03em;margin:8px 0 14px}
h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.015em;margin:22px 0 10px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px} .grow{flex:1;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:6px 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;width:100%;text-align:center;border:2px solid transparent;margin-top:10px}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.secondary{background:var(--surface);border-color:var(--line)}
.btn.ghost{color:var(--brand);min-height:44px}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.danger{background:var(--bad-bg);color:var(--bad-ink)}
.btn.sm{min-height:42px;font-size:14px;padding:0 16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:block;width:100%}
button.card{text-align:left;box-sizing:border-box;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.bad{background:var(--bad-bg);color:var(--bad-ink)} .pill.brand{background:var(--brand);color:var(--on-brand)}
.pill.trade{background:hsl(var(--h) var(--tint-s) var(--tint-l));color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;min-height:40px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.notice{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink)}
.notice b{display:block;margin-bottom:2px}
.notice.ok{background:var(--ok-bg);color:var(--ok-ink)} .notice.bad{background:var(--bad-bg);color:var(--bad-ink)} .notice.info{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.notice+.notice,.card+.notice,.notice+.card,.notice+.btn{margin-top:12px}
label.f{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea{min-height:96px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--brand)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0} .kv b{text-align:right}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.grid.cols{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}}
.price{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.nav{display:flex;flex:none;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--muted);min-height:58px;text-align:center;justify-content:center}
.nav button[aria-current="page"]{color:var(--brand)}
.nav .badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--on-gold);font-size:11px;display:grid;place-items:center;padding:0 5px}
.nav button{position:relative}
@media(min-width:900px){
  #app{flex-direction:row}
  .nav{order:-1;flex-direction:column;width:200px;border-top:0;border-right:1px solid var(--line);padding:16px 10px;gap:4px;justify-content:flex-start}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px;justify-content:flex-start;min-height:48px;text-align:left}
  .nav button[aria-current="page"]{background:var(--bg)}
  .nav .badge{position:static;margin-left:auto}
}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 14px 24px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.timeline li::after{content:"";position:absolute;left:9px;top:16px;bottom:-2px;width:1.5px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline time{display:block;font-size:12px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.th{width:84px;border-radius:12px;background:var(--line);padding:8px 4px;text-align:center;font-size:20px;line-height:1.2}
.th small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.vt{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;flex:none}
.vt button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px;min-height:36px;color:var(--muted)}
.vt button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.fsearch{position:relative;margin:10px 0 2px}
.fsearch>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.fsearch input{padding-left:44px;min-height:50px}
.map{position:relative;width:100%;max-width:620px;margin:0 auto;aspect-ratio:1/1;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .st{stroke:var(--line);stroke-width:.35;fill:none}
.map .riv{stroke:var(--brand);stroke-opacity:.25;stroke-width:3;fill:none;stroke-linecap:round}
.map .ring{stroke:var(--muted);stroke-opacity:.5;stroke-width:.3;stroke-dasharray:1.2 1.2;fill:none}
.map .edge{stroke:var(--brand);stroke-opacity:.8;stroke-width:.5;stroke-dasharray:2 1.2;fill:none}
.map .lbl{fill:var(--muted);font-size:2.8px;font-weight:700;font-family:inherit}
.map .you{fill:var(--brand);stroke:var(--surface);stroke-width:.9}
.pin{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:hsl(var(--h) 62% 40%);display:grid;place-items:center;font-size:17px;line-height:1;border:2.5px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.3);padding:0;text-align:center}
.pin[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px;z-index:2}
.emfab{position:fixed;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:30;height:36px;padding:0 14px;border-radius:999px;background:var(--bad-ink);color:var(--surface);font-weight:800;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center}
.emfab[hidden]{display:none}
@media(min-width:900px){.emfab{bottom:16px;right:16px}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:90%;text-align:center;z-index:50}
#toast[hidden]{display:none}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.demo{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--gold);color:var(--on-gold);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.calbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:2px 0}
.cd{aspect-ratio:1/1;min-height:40px;border-radius:12px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:var(--bg);text-align:center}
.cd.today{border-color:var(--brand)}
.cd.pref{box-shadow:inset 0 0 0 2px var(--gold)}
.cd[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.cd:disabled{opacity:.35;cursor:not-allowed}
.cd .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:2px}
.cd .dot.open{background:transparent;border:1.5px solid var(--gold)}
.dotkey{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:5px}
.dotkey.open{background:transparent;border:1.5px solid var(--gold)}

function buildPdf(lines){const W=595,H=842,M=50,pages=[[]];let y=H-M;

 const kids=[];pages.forEach((p,i)=>{const pid=5+2*i,cid=6+2*i;kids.push(pid+' 0 R');const st=p.map(l=>'BT /F'+(l.b?2:1)+' '+l.s+' Tf '+M+' '+l.y+' Td ('+pdfSafe(l.t)+') Tj ET').join('\n');
  objs[pid]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cid+' 0 R >>';objs[cid]='<< /Length '+st.length+' >>\nstream\n'+st+'\nendstream'});

/* QR code encoder: byte mode, error correction M, versions 1 to 10 (up to 213 characters) */
const QR_EC={1:[10,[[1,16]]],2:[16,[[1,28]]],3:[26,[[1,44]]],4:[18,[[2,32]]],5:[24,[[2,43]]],6:[16,[[4,27]]],7:[18,[[4,31]]],8:[22,[[2,38],[2,39]]],9:[22,[[3,36],[2,37]]],10:[26,[[4,43],[1,44]]]};

 put(0,Math.min(4,total*8-bits.length));while(bits.length%8)bits.push(0);
 const cw=[];for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=v*2+bits[i+j];cw.push(v)}
 for(let p=0;cw.length<total;p++)cw.push(p%2?0x11:0xec);
 const blocks=[];let k=0;groups.forEach(([n,d])=>{for(let i=0;i<n;i++){blocks.push(cw.slice(k,k+d));k+=d}});
 const ecs=blocks.map(b=>rsEc(b,ecn)),out=[],maxd=Math.max(...blocks.map(b=>b.length));
